<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aliyun FC → Doubao TTS Lab v4</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:820px;margin:36px auto;padding:0 16px;line-height:1.55;color:#202124}
textarea,input,button{font:inherit}
textarea,input{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 14px}
textarea{min-height:96px;resize:vertical}
#instruction{min-height:150px}
button{padding:10px 16px;cursor:pointer;margin:4px 8px 4px 0}
pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:12px;border-radius:8px;max-height:420px;overflow:auto}
audio{width:100%;margin-top:16px}
.ok{color:#188038}.err{color:#b3261e}
.note{font-size:13px;opacity:.76}
.panel{border:1px solid #ddd;border-radius:12px;padding:14px;margin:18px 0}
.preview{background:#fafafa;border:1px solid #e5e5e5;border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-word}
label{font-weight:600}
</style>
</head>
<body>
<h2>Aliyun FC → Doubao TTS Lab v4</h2>
<p>只测试两种真实使用形态：<b>总体声音指令 + 局部语音标签</b>，以及<b>仅总体声音指令</b>。不传历史对话上下文。</p>

<div class="panel">
  <label>Proxy URL</label>
  <input id="url" value="https://persona-gateway-oxcpmcibhq.cn-beijing.fcapp.run">

  <label>PROXY_TOKEN</label>
  <input id="token" type="password" autocomplete="off" placeholder="只保存在当前浏览器 localStorage">
  <div>
    <button id="saveToken">保存 token 到本机</button>
    <button id="clearToken">清除本机 token</button>
  </div>
</div>

<div class="panel">
  <label>总体声音指令（发送为 context_texts[0]）</label>
  <textarea id="instruction">除非具体指令明确要求强烈表现，否则保持自然日常、克制的对话尺度，避免舞台化夸张，不自动提高音量、夸张拉长音调或加入强烈喊叫。承接刚得知一个此前不知道的信息；整体亲近、不责怪，轻微意外，随后觉得有点好笑。</textarea>

  <label>局部语音标签（不要写方括号，Lab 会自动加一次）</label>
  <textarea id="tag">先短暂愣了一下，有一点迟疑；很快反应过来，语气逐渐放松；最后带一点很轻的笑意，自然收住</textarea>

  <label>真正朗读的正文</label>
  <textarea id="text">你现在才告诉我？难怪我刚才一直没想明白。</textarea>

  <div>
    <button id="runWithTag">生成：总指令 + Tag</button>
    <button id="runNoTag">生成：仅总指令</button>
  </div>
</div>

<h3>本次最终输入预览</h3>
<div id="preview" class="preview">尚未请求。</div>

<p id="status"></p>
<audio id="audio" controls hidden></audio>

<p class="note">v4 不修改正式聊天、不写入正式 IndexedDB 音频缓存。Tag 只是按火山官方文档的 <code>[自然语言描述]正文</code> 形式拼到本次 text 前；总体指令单独传给代理。</p>

<h3>响应 / 错误</h3>
<pre id="debug">尚未请求。</pre>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const TOKEN_KEY = 'personal_ai_tts_proxy_token_v1';
  let audioUrl = null;

  $('token').value = localStorage.getItem(TOKEN_KEY) || '';

  $('saveToken').onclick = () => {
    const token = $('token').value.trim();
    if (!token) {
      $('status').className = 'err';
      $('status').textContent = 'token 为空，未保存。';
      return;
    }
    localStorage.setItem(TOKEN_KEY, token);
    $('status').className = 'ok';
    $('status').textContent = 'PROXY_TOKEN 已保存到当前浏览器 localStorage。';
  };

  $('clearToken').onclick = () => {
    localStorage.removeItem(TOKEN_KEY);
    $('token').value = '';
    $('status').className = '';
    $('status').textContent = '已清除本机 token。';
  };

  function b64ToBlob(base64, type) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new Blob([bytes], { type });
  }

  function normalizeTag(raw) {
    let tag = String(raw || '').trim();
    if (tag.startsWith('[') && tag.endsWith(']')) {
      tag = tag.slice(1, -1).trim();
    }
    return tag;
  }

  function buildFinalText(useTag) {
    const text = $('text').value.trim();
    const tag = normalizeTag($('tag').value);
    if (!useTag || !tag) return text;
    return `[${tag}]${text}`;
  }

  async function run(useTag) {
    const url = $('url').value.trim();
    const token = $('token').value.trim();
    const instruction = $('instruction').value.trim();
    const spokenText = $('text').value.trim();
    const tag = normalizeTag($('tag').value);
    const finalText = buildFinalText(useTag);

    if (!token) {
      $('status').className = 'err';
      $('status').textContent = '请先填入 PROXY_TOKEN。';
      return;
    }
    if (!spokenText) {
      $('status').className = 'err';
      $('status').textContent = '正文为空。';
      return;
    }
    if (!instruction) {
      $('status').className = 'err';
      $('status').textContent = '这轮实验要求有总体声音指令，请先填写 instruction。';
      return;
    }

    const payload = {
      token,
      text: finalText,
      instruction
    };

    $('preview').textContent = [
      `模式：${useTag ? '总体声音指令 + Tag' : '仅总体声音指令'}`,
      '',
      'instruction / context_texts[0]:',
      instruction,
      '',
      useTag ? `tag: [${tag}]` : 'tag: （本次不发送）',
      '',
      '最终 text:',
      finalText
    ].join('\n');

    $('status').className = '';
    $('status').textContent = '请求中…';
    $('debug').textContent = '请求中…';
    $('runWithTag').disabled = true;
    $('runNoTag').disabled = true;

    try {
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify(payload)
      });

      const raw = await r.text();
      $('debug').textContent = [
        `HTTP ${r.status}`,
        '',
        raw.slice(0, 5000),
        '',
        'CLIENT REQUEST (token omitted):',
        JSON.stringify({
          instruction,
          text: finalText,
          mode: useTag ? 'instruction+tag' : 'instruction-only'
        }, null, 2)
      ].join('\n');

      if (!r.ok) throw new Error(`HTTP ${r.status}`);

      const data = JSON.parse(raw);
      if (!data.ok || !data.audioBase64) {
        throw new Error(data.error || '响应里没有 audioBase64');
      }

      const blob = b64ToBlob(data.audioBase64, data.contentType || 'audio/mpeg');
      if (audioUrl) URL.revokeObjectURL(audioUrl);
      audioUrl = URL.createObjectURL(blob);

      $('audio').src = audioUrl;
      $('audio').hidden = false;
      $('status').className = 'ok';
      $('status').textContent = `成功，音频 ${Math.round(blob.size / 1024)} KB。`;
    } catch (e) {
      $('status').className = 'err';
      $('status').textContent = '失败：' + (e.message || e);
      $('debug').textContent += '\n\nERROR:\n' + (e.stack || e);
    } finally {
      $('runWithTag').disabled = false;
      $('runNoTag').disabled = false;
    }
  }

  $('runWithTag').onclick = () => run(true);
  $('runNoTag').onclick = () => run(false);

  addEventListener('beforeunload', () => {
    if (audioUrl) URL.revokeObjectURL(audioUrl);
  });
})();
</script>
</body>
</html>
