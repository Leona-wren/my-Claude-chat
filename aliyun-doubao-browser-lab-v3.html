<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aliyun FC → Doubao TTS Lab v3</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:760px;margin:40px auto;padding:0 16px;line-height:1.5}
textarea,input,button{font:inherit}
textarea,input{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 14px}
textarea{min-height:110px}
button{padding:10px 16px;cursor:pointer;margin-right:8px}
pre{white-space:pre-wrap;word-break:break-word;background:#f5f5f5;padding:12px;border-radius:8px;max-height:320px;overflow:auto}
audio{width:100%;margin-top:16px}
.ok{color:#188038} .err{color:#b3261e}
.note{font-size:13px;opacity:.75}
</style>
</head>
<body>
<h2>Aliyun FC → Doubao TTS Lab v3</h2>
<p>这版使用应用层 PROXY_TOKEN，并以 <code>text/plain</code> 发送 JSON 字符串，避免 CORS 预检。</p>

<label>Proxy URL</label>
<input id="url" value="https://persona-gateway-oxcpmcibhq.cn-beijing.fcapp.run">

<label>PROXY_TOKEN</label>
<input id="token" type="password" autocomplete="off" placeholder="只保存在当前浏览器 localStorage">
<div>
  <button id="saveToken">保存 token 到本机</button>
  <button id="clearToken">清除本机 token</button>
</div>

<label>测试文本</label>
<textarea id="text">你好，这是经过应用层鉴权后的豆包语音测试。</textarea>

<button id="run">生成测试语音</button>
<p id="status"></p>
<audio id="audio" controls hidden></audio>

<p class="note">GitHub 文件中不包含你的 token。token 只从本机输入并可保存在 localStorage。</p>

<h3>响应 / 错误</h3>
<pre id="debug">尚未请求。</pre>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const TOKEN_KEY = 'personal_ai_tts_proxy_token_v1';
  let audioUrl = null;

  $('token').value = localStorage.getItem(TOKEN_KEY) || '';

  $('saveToken').onclick = () => {
    const token = $('token').value.trim();
    if (!token) {
      $('status').className = 'err';
      $('status').textContent = 'token 为空，未保存。';
      return;
    }
    localStorage.setItem(TOKEN_KEY, token);
    $('status').className = 'ok';
    $('status').textContent = 'PROXY_TOKEN 已保存到当前浏览器 localStorage。';
  };

  $('clearToken').onclick = () => {
    localStorage.removeItem(TOKEN_KEY);
    $('token').value = '';
    $('status').className = '';
    $('status').textContent = '已清除本机 token。';
  };

  function b64ToBlob(base64, type) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new Blob([bytes], { type });
  }

  $('run').onclick = async () => {
    const url = $('url').value.trim();
    const token = $('token').value.trim();
    const text = $('text').value.trim();

    if (!token) {
      $('status').className = 'err';
      $('status').textContent = '请先填入 PROXY_TOKEN。';
      return;
    }

    $('status').className = '';
    $('status').textContent = '请求中…';
    $('debug').textContent = '请求中…';
    $('run').disabled = true;

    try {
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify({ token, text })
      });

      const raw = await r.text();
      $('debug').textContent = `HTTP ${r.status}\n\n${raw.slice(0, 5000)}`;

      if (!r.ok) throw new Error(`HTTP ${r.status}`);

      const data = JSON.parse(raw);
      if (!data.ok || !data.audioBase64) {
        throw new Error(data.error || '响应里没有 audioBase64');
      }

      const blob = b64ToBlob(data.audioBase64, data.contentType || 'audio/mpeg');
      if (audioUrl) URL.revokeObjectURL(audioUrl);
      audioUrl = URL.createObjectURL(blob);

      $('audio').src = audioUrl;
      $('audio').hidden = false;
      $('status').className = 'ok';
      $('status').textContent = `成功，音频 ${Math.round(blob.size / 1024)} KB。`;
    } catch (e) {
      $('status').className = 'err';
      $('status').textContent = '失败：' + (e.message || e);
      $('debug').textContent += '\n\nERROR:\n' + (e.stack || e);
    } finally {
      $('run').disabled = false;
    }
  };

  addEventListener('beforeunload', () => {
    if (audioUrl) URL.revokeObjectURL(audioUrl);
  });
})();
</script>
</body>
</html>
