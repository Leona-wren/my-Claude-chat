  // ── MESSAGE IDENTITY UTILS (P0 merge/import fix) ─────
  //
  // Principles:
  // content/timestamp/role/index alone are NOT identity.
  // Same chatId+content at different positions must be preserved.
  // Merge prefers over-retain, never deletes.
  // normalize* functions return NEW objects, never mutate input.

  function hashString(s) {
    let h = 5381;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h) ^ s.charCodeAt(i);
    return (h >>> 0).toString(16);
  }

  function getMessageTextFields(message) {
    const content = message.content || '';
    const en      = message.en      || '';
    const zh      = message.zh      || '';
    const text    = message.text    || '';
    const displayText = content || zh || en || text;
    return { content, en, zh, text, displayText };
  }

  const FIELD_SEP = '\u0001';

  // Field-tagged serialization to avoid boundary collisions between fields.
  function messageTextHash(message) {
    const f = getMessageTextFields(message);
    const serialized = [
      `content:${f.content}`,
      `en:${f.en}`,
      `zh:${f.zh}`,
      `text:${f.text}`
    ].join(FIELD_SEP);
    return hashString(serialized);
  }

  // Browser-compatible UUID generator. Falls back to a high-entropy string
  // (never a bare Date.now()) when crypto.randomUUID is unavailable.
  function generateUuid() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) {
      return crypto.randomUUID();
    }
    const rand = (typeof crypto !== 'undefined' && crypto.getRandomValues)
      ? Array.from(crypto.getRandomValues(new Uint8Array(10))).map(b => b.toString(36)).join('')
      : Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    return Date.now().toString(36) + '-' + rand;
  }

  // Only affects NEW messages. legacy_ ids (makeLegacyMessageId) and conflict_ ids
  // (makeConflictMessageId) are untouched.
  function makeMessageId() {
    return 'msg_' + generateUuid();
  }

  // createdAt/timestamp are only weak evidence here, never an independent dedupe key.
  // chatId is included explicitly so identical content/index in different chats never collide.
  function makeLegacyMessageId(chatId, index, message) {
    const weakTimeEvidence = message.createdAt || message.timestamp || '';
    const input = [
      `chatId:${chatId}`,
      `index:${index}`,
      `role:${message.role}`,
      `time:${weakTimeEvidence}`,
      `hash:${messageTextHash(message)}`
    ].join(FIELD_SEP);
    return 'legacy_' + hashString(input);
  }

  function makeConflictMessageId(originalId, message) {
    return `conflict_${originalId}_${messageTextHash(message)}_${Date.now()}`;
  }

  // Returns a NEW message object. Never deletes existing fields (e.g. legacy `seq` is kept).
  function normalizeMessage(message, context) {
    const id = message.id || makeLegacyMessageId(context.chatId, context.index, message);
    const clientSeq = message.clientSeq ?? message.seq ?? context.index;
    return {
      ...message,
      id,
      chatId: message.chatId || context.chatId,
      clientSeq,
      migratedFromLegacy: message.id ? (message.migratedFromLegacy || false) : true
    };
  }

  // Returns a NEW chat object with a NEW messages array.
  function normalizeChat(chat, chatId) {
    return {
      ...chat,
      messages: chat.messages.map((m, i) => normalizeMessage(m, { chatId, index: i }))
    };
  }

  // Returns a NEW chats object. Does not mutate the input.
  function normalizeAllChats(chatsObj) {
    const result = {};
    Object.keys(chatsObj).forEach(id => {
      result[id] = normalizeChat(chatsObj[id], id);
    });
    return result;
  }

  function messagesEquivalent(a, b) {
    return messageTextHash(a) === messageTextHash(b);
  }

  // Assumes both inputs are already normalized (have stable ids).
  // id match + same content  -> skip (true duplicate)
  // id match + diff content  -> keep both, imported gets a conflict id
  // no id match               -> keep both
  // Never deletes anything from localMsgs.
  function mergeMessagesSafe(localMsgs, importedMsgs, chatId) {
    const localById = new Map(localMsgs.filter(m => m.id).map(m => [m.id, m]));
    const toAppend = [];
    importedMsgs.forEach(im => {
      const lm = im.id ? localById.get(im.id) : undefined;
      if (!lm) {
        toAppend.push(im);
      } else if (messagesEquivalent(lm, im)) {
        // duplicate — skip imported copy, local copy untouched
      } else {
        toAppend.push({ ...im, id: makeConflictMessageId(im.id, im), conflictWith: im.id });
      }
    });
    return [...localMsgs, ...toAppend];
  }

  // ── CHAT IDENTITY (P0-2) ──────────────────────────────
  // chatId is immutable chat entity identity. Only newChat() and the
  // "brand new chatId" import branch may create one. Soft delete / trash /
  // restore / import never rewrite an existing chatId.

  function isChatIdReserved(chatId) {
    return !!chats[chatId] || !!loadTrash()[chatId];
  }

  function makeChatId() {
    let id;
    do { id = 'chat_' + generateUuid(); } while (isChatIdReserved(id));
    return id;
  }

  // ── TEMPORAL SCHEMA (P0-2) ────────────────────────────
  // createdAt/createdTimeZone/updatedAt are metadata, never message/chat identity.
  // timestamps never single-handedly decide dedupe, lifecycle conflicts, or restore.

  function isValidEpoch(v) {
    return typeof v === 'number' && Number.isFinite(v) && v > 0;
  }

  function formatMessageTimestamp(message, now = Date.now()) {
    if (!message || !isValidEpoch(message.createdAt)) return '时间未知';

    const displayTimeZone = message.createdTimeZone || Intl.DateTimeFormat().resolvedOptions().timeZone;
    const date = new Date(message.createdAt);

    // messageYear and currentYear must both be computed under the SAME displayTimeZone,
    // otherwise cross-timezone/cross-year-boundary comparisons can silently omit the year.
    const messageYear = Number(
      new Intl.DateTimeFormat('en-US', { year: 'numeric', timeZone: displayTimeZone }).format(date)
    );
    const currentYear = Number(
      new Intl.DateTimeFormat('en-US', { year: 'numeric', timeZone: displayTimeZone }).format(new Date(now))
    );

    const opts = {
      month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit',
      hour12: false, timeZone: displayTimeZone
    };
    if (messageYear !== currentYear) opts.year = 'numeric';

    return new Intl.DateTimeFormat('zh-CN', opts).format(date);
  }

  // Compares only the three fields this stage manages. Never a whole-chat comparison.
  function temporalMetadataEquivalent(a, b) {
    return a.createdAt === b.createdAt &&
           a.createdTimeZone === b.createdTimeZone &&
           a.updatedAt === b.updatedAt;
  }

  // Returns a NEW chat object. createdAt/timezone pair rules:
  // - incoming strictly earlier (or local invalid) -> adopt incoming's createdAt+timezone pair
  // - createdAt equal -> keep local createdAt; complete createdTimeZone from incoming only if
  //   local timezone is missing (never overwrite a local timezone that is already present)
  // - otherwise -> keep local pair unchanged
  // updatedAt = max of local.updatedAt / incoming.updatedAt / any valid message.createdAt in mergedMessages.
  function reconcileChatTemporalMetadata(localChat, incomingChat, mergedMessages) {
    const localValid = isValidEpoch(localChat.createdAt);
    const incomingValid = isValidEpoch(incomingChat.createdAt);

    let createdAt = localChat.createdAt;
    let createdTimeZone = localChat.createdTimeZone;

    if (incomingValid && (!localValid || incomingChat.createdAt < localChat.createdAt)) {
      createdAt = incomingChat.createdAt;
      createdTimeZone = incomingChat.createdTimeZone;
    } else if (localValid && incomingValid && incomingChat.createdAt === localChat.createdAt) {
      createdAt = localChat.createdAt;
      createdTimeZone = localChat.createdTimeZone || incomingChat.createdTimeZone;
    }

    const updatedAtCandidates = [
      localChat.updatedAt,
      incomingChat.updatedAt,
      ...mergedMessages.map(m => m.createdAt)
    ].filter(isValidEpoch);

    const updatedAt = updatedAtCandidates.length
      ? Math.max(...updatedAtCandidates)
      : localChat.updatedAt;

    return { ...localChat, createdAt, createdTimeZone, updatedAt };
  }

  // Only for a pair already confirmed to be the SAME message entity
  // (same id AND messagesEquivalent === true). Returns a NEW message object.
  // Never resolves a createdAt conflict by picking earlier/later — that would
  // upgrade a metadata disagreement into a fabricated identity decision.
  function reconcileMessageTemporalMetadata(localMessage, incomingMessage) {
    const localValid = isValidEpoch(localMessage.createdAt);
    const incomingValid = isValidEpoch(incomingMessage.createdAt);

    let createdAt = localMessage.createdAt;
    let createdTimeZone = localMessage.createdTimeZone;

    if (!localValid && incomingValid) {
      createdAt = incomingMessage.createdAt;
      createdTimeZone = incomingMessage.createdTimeZone;
    } else if (localValid && incomingValid && localMessage.createdAt === incomingMessage.createdAt) {
      createdTimeZone = localMessage.createdTimeZone || incomingMessage.createdTimeZone;
    }
    // both valid but different createdAt -> keep local pair, no completion, no conflict escalation

    return { ...localMessage, createdAt, createdTimeZone };
  }

  // Post-processing layer over mergeMessagesSafe's output. Does NOT do identity/dedupe
  // decisions — those belong entirely to mergeMessagesSafe (P0-1 core, untouched).
  // Only completes temporal metadata for messages confirmed to be the same entity.
  function reconcileEquivalentMessageMetadata(mergedMessages, incomingMessages) {
    const incomingById = new Map(incomingMessages.filter(m => m.id).map(m => [m.id, m]));
    return mergedMessages.map(localMsg => {
      if (!localMsg.id) return localMsg;
      const incomingMsg = incomingById.get(localMsg.id);
      if (!incomingMsg) return localMsg; // no matching incoming id (includes conflict_ ids)
      if (!messagesEquivalent(localMsg, incomingMsg)) return localMsg; // id conflict, not same entity
      return reconcileMessageTemporalMetadata(localMsg, incomingMsg);
    });
  }

  // ── STORAGE ADAPTERS (P0-2) ───────────────────────────
  function loadTrash() {
    return JSON.parse(localStorage.getItem('claude_trash') || '{}');
  }
  function saveTrash(trash) {
    localStorage.setItem('claude_trash', JSON.stringify(trash));
  }
  function saveActiveChats() {
    save();
  }

  function loadPendingAudioCleanup() {
    return JSON.parse(localStorage.getItem('claude_pending_audio_cleanup') || '[]');
  }
  function savePendingAudioCleanup(list) {
    localStorage.setItem('claude_pending_audio_cleanup', JSON.stringify(list));
  }
  async function deleteAudioWithFallback(chatId) {
    const ok = await AudioStorage.deleteByChatId(chatId);
    if (!ok) {
      const pending = loadPendingAudioCleanup();
      if (!pending.includes(chatId)) {
        pending.push(chatId);
        savePendingAudioCleanup(pending);
      }
    }
    return ok;
  }
  async function retryPendingAudioCleanup() {
    const pending = loadPendingAudioCleanup();
    if (pending.length === 0) return;
    const stillPending = [];
    for (const chatId of pending) {
      const ok = await AudioStorage.deleteByChatId(chatId);
      if (!ok) stillPending.push(chatId);
    }
    savePendingAudioCleanup(stillPending);
  }

  // ── CHAT LIFECYCLE DOMAIN (P0-2) ──────────────────────
  // No DOM/event access, no renderSidebar/modal calls. Returns structured
  // { ok, action/reason, ... } results; UI controllers decide what to render.

  function moveChatToTrash(chatId) {
    if (!chats[chatId]) return { ok: false, reason: 'CHAT_NOT_FOUND' };
    const trash = loadTrash();
    const now = Date.now();
    trash[chatId] = {
      chatId,
      chat: chats[chatId],
      state: 'trashed',
      deletedAt: now,
      deleteAfter: now + 7 * 24 * 60 * 60 * 1000,
      hasImportedChangesWhileTrashed: false,
      lastImportedMergeAt: null
    };
    saveTrash(trash);
    delete chats[chatId];
    chatOrder = chatOrder.filter(cid => cid !== chatId);
    saveActiveChats();
    return { ok: true, action: 'trashed', chatId };
  }

  function restoreChatFromTrash(chatId) {
    const trash = loadTrash();
    if (!trash[chatId]) return { ok: false, reason: 'TRASH_ITEM_NOT_FOUND' };
    chats[chatId] = trash[chatId].chat;
    chatOrder.unshift(chatId);
    delete trash[chatId];
    saveTrash(trash);
    saveActiveChats();
    return { ok: true, action: 'restored', chatId };
  }

  function permanentlyDeleteChat(chatId) {
    const trash = loadTrash();
    if (!trash[chatId]) return { ok: false, reason: 'TRASH_ITEM_NOT_FOUND' };
    delete trash[chatId];
    saveTrash(trash);
    // Text snapshot deletion above is already committed; audio cleanup failure
    // must not block or reverse it — deleteAudioWithFallback queues a retry instead.
    deleteAudioWithFallback(chatId);
    return { ok: true, action: 'permanentlyDeleted', chatId };
  }

  function purgeExpiredTrash() {
    const trash = loadTrash();
    const now = Date.now();
    const purged = [];
    Object.keys(trash).forEach(chatId => {
      if (trash[chatId].deleteAfter <= now) {
        delete trash[chatId];
        purged.push(chatId);
      }
    });
    if (purged.length) saveTrash(trash);
    purged.forEach(chatId => deleteAudioWithFallback(chatId));
    return { ok: true, action: 'purged', chatIds: purged };
  }

  // Pure domain helper: no loadTrash/saveTrash, no DOM/IndexedDB access.
  // Returns { item: newItem, result } without persisting anything.
  function mergeIncomingIntoTrashedItem(item, chatId, incomingChat) {
    const normalizedIncoming = normalizeChat(incomingChat, chatId);
    const localMessages = item.chat.messages;
    const messagesSame = JSON.stringify(localMessages) === JSON.stringify(normalizedIncoming.messages);

    let finalMessages = localMessages;
    let hasImportedMessageRecords = false;

    if (!messagesSame) {
      const mergedMessages = mergeMessagesSafe(localMessages, normalizedIncoming.messages, chatId);
      // P0-1 semantics: new/conflict append -> length grows; exact duplicate or
      // metadata-only completion -> length unchanged.
      hasImportedMessageRecords = mergedMessages.length > localMessages.length;
      finalMessages = reconcileEquivalentMessageMetadata(mergedMessages, normalizedIncoming.messages);
    }

    const messagesChanged = JSON.stringify(finalMessages) !== JSON.stringify(localMessages);

    const reconciledChat = reconcileChatTemporalMetadata(
      { ...item.chat, messages: finalMessages },
      normalizedIncoming,
      finalMessages
    );
    const temporalChanged = !temporalMetadataEquivalent(item.chat, reconciledChat);
    const snapshotChanged = messagesChanged || temporalChanged;

    // { ...item } preserves state/deletedAt/deleteAfter untouched, and never
    // resets hasImportedChangesWhileTrashed back to false once it was true.
    const newItem = { ...item, chat: reconciledChat };
    if (hasImportedMessageRecords) {
      newItem.hasImportedChangesWhileTrashed = true;
      newItem.lastImportedMergeAt = Date.now();
    }

    return {
      item: newItem,
      result: {
        ok: true,
        action: 'mergedIntoTrash',
        chatId,
        changed: snapshotChanged,
        hasImportedMessageRecords
      }
    };
  }

  // Storage orchestration: loads trash, delegates to the pure domain helper,
  // writes back only if the snapshot actually changed.
  function mergeIncomingIntoTrashedChat(chatId, incomingChat) {
    const trash = loadTrash();
    const item = trash[chatId];
    if (!item) return { ok: false, reason: 'TRASH_ITEM_NOT_FOUND' };

    const { item: newItem, result } = mergeIncomingIntoTrashedItem(item, chatId, incomingChat);
    if (result.changed) {
      trash[chatId] = newItem;
      saveTrash(trash);
    }
    return result;
  }

  // ── EXPORT / IMPORT ──────────────────────────────────
  function exportChats() {
    // Export uses a normalized COPY only — global `chats` and localStorage are untouched.
    const data = { chats: normalizeAllChats(chats), chatOrder, exportedAt: new Date().toISOString(), schemaVersion: 2 };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'claude-chat-export-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function importChats(e) {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = evt => {
      let data;
      try { data = JSON.parse(evt.target.result); } catch (_) {
        setStatus('导入失败：文件不是合法 JSON', 'err');
        return;
      }
      if (!data.chats || typeof data.chats !== 'object' ||
          !Array.isArray(data.chatOrder)) {
        setStatus('导入失败：缺少 chats 或 chatOrder 字段', 'err');
        return;
      }
      const validIds = data.chatOrder.filter(id => data.chats[id] &&
        Array.isArray(data.chats[id].messages));
      if (validIds.length === 0) {
        setStatus('导入失败：文件内没有有效对话', 'err');
        return;
      }

      // Real write: local chats are normalized once so legacy messages gain stable ids
      // going forward (otherwise old user messages would never become comparable).
      chats = normalizeAllChats(chats);
      // Imported chats normalized using their OWN original chatId, so legacy ids
      // carry the source chat's identity.
      const normalizedImportedChats = normalizeAllChats(data.chats);
      // Read trash once; preview and actual routing both reuse this same snapshot
      // for membership checks (the read-modify-write itself still goes through the
      // single mergeIncomingIntoTrashedChat domain call, not scattered here).
      const trashSnapshot = loadTrash();

      // title plays no role in identity/import routing: same chatId = same entity,
      // different chatId = different entity, regardless of title.
      let willAdd = 0, willSkip = 0, willMergeActive = 0, willMergeTrash = 0;
      validIds.forEach(id => {
        const incoming = normalizedImportedChats[id];
        if (chats[id]) {
          const localChat = chats[id];
          const messagesSame = JSON.stringify(localChat.messages) === JSON.stringify(incoming.messages);
          let finalMessages = localChat.messages;
          if (!messagesSame) {
            const mergedMessages = mergeMessagesSafe(localChat.messages, incoming.messages, id);
            finalMessages = reconcileEquivalentMessageMetadata(mergedMessages, incoming.messages);
          }
          const messagesWouldChange = JSON.stringify(finalMessages) !== JSON.stringify(localChat.messages);
          const previewReconciled = reconcileChatTemporalMetadata(
            { ...localChat, messages: finalMessages }, incoming, finalMessages
          );
          const temporalWouldChange = !temporalMetadataEquivalent(localChat, previewReconciled);
          if (!messagesWouldChange && !temporalWouldChange) willSkip++;
          else willMergeActive++;
        } else if (trashSnapshot[id]) {
          const { result } = mergeIncomingIntoTrashedItem(trashSnapshot[id], id, incoming);
          if (result.changed) willMergeTrash++;
          else willSkip++;
        } else {
          willAdd++;
        }
      });

      if (!confirm(
        `合并导入预览：\n` +
        `• 新增对话：${willAdd} 条\n` +
        `• 合并已有对话：${willMergeActive} 条（相同对话 ID，按消息合并）\n` +
        `• 回收站内更新：${willMergeTrash} 条（不会恢复，仅更新回收站快照）\n` +
        `• 完全相同：${willSkip} 条，跳过\n\n` +
        `本地现有 ${chatOrder.length} 条对话不会被删除。\n` +
        `本次导入会为本地历史消息补全内部标识字段（不改变消息内容和顺序）。\n` +
        `音频缓存不随 JSON 迁移，历史语音第一次播放时会重新生成。\n\n` +
        `确认继续？`
      )) return;

      let added = 0, skipped = 0, merged = 0, mergedIntoTrash = 0;

      validIds.forEach(id => {
        const incoming = normalizedImportedChats[id];

        if (chats[id]) {
          const localChat = chats[id];
          const messagesSame = JSON.stringify(localChat.messages) === JSON.stringify(incoming.messages);
          let finalMessages = localChat.messages;
          if (!messagesSame) {
            const mergedMessages = mergeMessagesSafe(localChat.messages, incoming.messages, id);
            finalMessages = reconcileEquivalentMessageMetadata(mergedMessages, incoming.messages);
          }
          const messagesChanged = JSON.stringify(finalMessages) !== JSON.stringify(localChat.messages);
          const reconciledChat = reconcileChatTemporalMetadata(
            { ...localChat, messages: finalMessages }, incoming, finalMessages
          );
          const temporalChanged = !temporalMetadataEquivalent(localChat, reconciledChat);
          if (!messagesChanged && !temporalChanged) {
            skipped++;
          } else {
            chats[id] = reconciledChat;
            merged++;
          }
        } else if (trashSnapshot[id]) {
          // same chatId hits trash: merge into the trash snapshot, never revive it.
          const result = mergeIncomingIntoTrashedChat(id, incoming);
          if (result.changed) mergedIntoTrash++;
          else skipped++;
        } else {
          // brand new chatId: independent chat entity, chatId kept as-is.
          chats[id] = incoming;
          chatOrder.push(id);
          added++;
        }
      });

      save();
      renderSidebar();
      flashStatus(`导入完成：新增 ${added}，合并 ${merged}，回收站更新 ${mergedIntoTrash}，跳过 ${skipped} ✓`, 'ok', 4000);
    };
    reader.readAsText(file);
  }

  // ── UTILS ────────────────────────────────────────────
  function save() {
    localStorage.setItem('claude_chats', JSON.stringify(chats));
    localStorage.setItem('claude_order', JSON.stringify(chatOrder));
  }

  function setStatus(msg, type = '') {
    statusRevision++;
    const el = document.getElementById('statusBar');
    el.textContent = msg;
    el.className = 'status-bar ' + type;
  }

  function clearStatusLater(ms) {
    const revision = statusRevision;
    setTimeout(() => {
      if (statusRevision === revision) setStatus('');
    }, ms);
  }

  function flashStatus(msg, type = '', ms = 1400) {
    setStatus(msg, type);
    clearStatusLater(ms);
  }

  // Request-status renderer only. Retry behavior itself lives in the controller
  // and domain/service functions above, so changing this UI does not change logic.
  function showRequestPending() {
    setStatus('…');
  }

  function showRequestSuccess() {
    flashStatus('✓', 'ok', 1200);
  }

  function showRequestFailure(message, chatId) {
    statusRevision++;
    const el = document.getElementById('statusBar');
    el.textContent = '';
    el.className = 'status-bar err request-failure';

    const text = document.createElement('div');
    text.textContent = message;

    const retry = document.createElement('button');
    retry.type = 'button';
    retry.className = 'retry-btn';
    retry.title = '重新生成回复';
    retry.setAttribute('aria-label', '重新生成回复');
    retry.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"></path><path d="M20 4v7h-7"></path></svg>';
    retry.addEventListener('click', () => handleRetryLatestReply(chatId));

    el.append(text, retry);
  }

  function syncRequestStatusForChat(chatId) {
    if (!chatId || !chats[chatId]) {
      setStatus('');
      return;
    }
    if (isLoading) {
      if (activeRequestChatId === chatId) showRequestPending();
      else setStatus('');
      return;
    }
    if (getLatestUnresolvedUserTurn(chats[chatId])) {
      showRequestFailure('回复未生成', chatId);
    } else {
      setStatus('');
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 130) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }

  function nowStr() {
    return new Date().toLocaleTimeString('zh', { hour: '2-digit', minute: '2-digit' });
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'\x26amp;').replace(/</g,'\x26lt;').replace(/>/g,'\x26gt;');
  }

  // ── APP INITIALIZATION ─────────────────────────────────
  // Run only after all function/state declarations are initialized. Keeping bootstrap
  // at the end prevents temporal-dead-zone bugs when future transient state is added.
  function initializeApp() {
    applySkin(currentSkin);
    initializeModelRegistry();
    if (!apiKey) setTimeout(() => openKey(), 400);
    renderSidebar();
    if (chatOrder.length > 0) loadChat(chatOrder[0]);
    updateSendAvailability();
    if (apiKey) refreshModelRegistry();
  }

  // ── LIFECYCLE MAINTENANCE (P0-2) ──────────────────────
  // Runs once after all definitions are in place; non-blocking.
  // retryPendingAudioCleanup() is NOT called here — audioDB may not be ready yet.
  // It runs from openAudioDB()'s onsuccess callback instead, once IndexedDB is actually open.
  initializeApp();
  purgeExpiredTrash();
</script>
</body>
</html>
