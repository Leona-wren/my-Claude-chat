<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ── 皮肤：自然绿（默认）── */
  body.skin-warm {
    --bg: #EDE8E0;
    --sidebar: #FFFFFF;
    --bubble-user: #5C7A4E;
    --bubble-user-text: #FFFFFF;
    --bubble-ai: #FFFFFF;
    --text: #2A2A25;
    --text-soft: #9A9A8A;
    --accent: #5C7A4E;
    --border: #E2DDD5;
    --input-bg: #FFFFFF;
    --hover: #F4F1EC;
    --active: #E8EAD8;
  }

  /* 自然绿专属覆盖 */
  body.skin-warm .sidebar {
    border-right: none;
    box-shadow: 2px 0 12px rgba(0,0,0,0.07);
  }
  body.skin-warm .sidebar-header { border-bottom: none; padding-bottom: 8px; }
  body.skin-warm .sidebar-header h1 { font-size: 18px; font-weight: 600; letter-spacing: 0; }
  body.skin-warm .new-chat-btn { border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 500; color: #fff; }
  body.skin-warm .chat-item { border-radius: 12px; padding: 10px 12px; font-size: 13.5px; }
  body.skin-warm .chat-area { padding: 24px 32px; gap: 12px; }
  body.skin-warm .msg { max-width: 68%; gap: 5px; }
  body.skin-warm .bubble { padding: 13px 18px; border-radius: 22px; font-size: 14.5px; line-height: 1.7; box-shadow: none; }
  body.skin-warm .msg.user .bubble {
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 6px;
    box-shadow: 0 2px 8px rgba(92,122,78,0.28);
  }
  body.skin-warm .msg.ai .bubble {
    background: #fff;
    border-bottom-left-radius: 6px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  body.skin-warm footer { padding: 8px 20px 20px; }
  body.skin-warm .input-row {
    border-radius: 20px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    border: 1px solid rgba(0,0,0,0.05);
    padding: 12px 12px 12px 20px;
  }
  body.skin-warm .input-row:focus-within {
    border-color: var(--accent);
    box-shadow: 0 4px 20px rgba(92,122,78,0.18);
  }
  body.skin-warm .send-btn { width: 38px; height: 38px; box-shadow: 0 2px 8px rgba(92,122,78,0.35); }
  body.skin-warm .send-btn svg { fill: #fff; }
  body.skin-warm .sidebar-btn { border-radius: 10px; }
  body.skin-warm .topbar { background: #F7F5F1; border-bottom: 1px solid var(--border); padding: 10px 24px; }
  body.skin-warm .modal { border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,0.14); }
  body.skin-warm .empty-hint { font-size: 15px; gap: 10px; }
  body.skin-warm .empty-hint .icon { font-size: 32px; opacity: 0.22; }
  body.skin-warm .msg-time { opacity: 0.55; }

  /* ── 皮肤：墨夜 ── */
  body.skin-dark {
    --bg: #1A1A1F;
    --sidebar: #141418;
    --bubble-user: #2E2E38;
    --bubble-ai: #222228;
    --text: #DDDBE0;
    --text-soft: #7A7880;
    --accent: #9E8FD4;
    --border: #2E2E38;
    --input-bg: #222228;
    --hover: #252530;
    --active: #2C2C3A;
  }


  /* ── 皮肤：WhatsApp ── */
  body.skin-wa {
    --bg: #ECE5DD;
    --sidebar: #FFFFFF;
    --bubble-user: #DCF8C6;
    --bubble-ai: #FFFFFF;
    --text: #111B21;
    --text-soft: #667781;
    --accent: #25D366;
    --border: #E9EDEF;
    --input-bg: #FFFFFF;
    --hover: #F5F6F6;
    --active: #E9EDEF;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    height: 100dvh;
    display: flex;
    overflow: hidden;
    transition: background 0.3s, color 0.3s;
  }

  /* SIDEBAR */
  .sidebar {
    width: 220px;
    min-width: 220px;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    transition: background 0.3s;
  }

  .sidebar-header {
    padding: 20px 16px 12px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-header h1 {
    font-size: 16px;
    font-weight: normal;
    color: var(--accent);
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }

  .new-chat-btn {
    width: 100%;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    font-family: 'Helvetica Neue', sans-serif;
    cursor: pointer;
    text-align: left;
    transition: opacity 0.2s;
  }

  .new-chat-btn:hover { opacity: 0.85; }

  .chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .chat-item {
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-family: 'Helvetica Neue', sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    transition: background 0.15s;
    white-space: nowrap;
    overflow: hidden;
  }

  .chat-item:hover { background: var(--hover); }
  .chat-item.active { background: var(--active); }

  .chat-item-title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chat-item-del {
    opacity: 0.55;
    font-size: 14px;
    color: var(--text-soft);
    flex-shrink: 0;
    line-height: 1;
    transition: opacity 0.15s;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0 2px;
  }

  .chat-item:hover .chat-item-del { opacity: 1; }

  .sidebar-footer {
    padding: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .sidebar-btn {
    width: 100%;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12px;
    font-family: 'Helvetica Neue', sans-serif;
    color: var(--text-soft);
    cursor: pointer;
    text-align: left;
    transition: background 0.15s;
  }

  .sidebar-btn:hover { background: var(--hover); }

  /* 皮肤切换排排坐 */
  .skin-row {
    display: flex;
    gap: 6px;
    padding: 4px 0 2px;
  }

  .skin-dot {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
    flex-shrink: 0;
  }

  .skin-dot:hover { transform: scale(1.15); }
  .skin-dot.selected { border-color: var(--accent); }
  .skin-dot.dot-warm { background: #5C7A4E; box-shadow: inset 0 0 0 2px #3d5435; }
  .skin-dot.dot-dark { background: #1A1A1F; box-shadow: inset 0 0 0 1px #9E8FD4; }
  .skin-dot.dot-wa { background: #25D366; box-shadow: inset 0 0 0 1px #128C7E; }

  .skin-label {
    font-size: 11px;
    color: var(--text-soft);
    font-family: 'Helvetica Neue', sans-serif;
    margin-bottom: 2px;
  }

  /* MAIN */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    height: 100dvh;
  }

  /* 顶部工具栏 */
  .topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-wrap: wrap;
  }

  .topbar select {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 12px;
    font-family: 'Helvetica Neue', sans-serif;
    color: var(--text);
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .topbar select:focus { border-color: var(--accent); }

  .model-control {
    display: none;
    align-items: center;
    gap: 6px;
    min-height: 28px;
  }

  .control-label,
  .thinking-type {
    font-size: 11px;
    font-family: 'Helvetica Neue', sans-serif;
    color: var(--text-soft);
    white-space: nowrap;
  }

  .thinking-type {
    color: var(--accent);
    opacity: 0.88;
  }

  .thinking-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-family: 'Helvetica Neue', sans-serif;
    color: var(--text-soft);
    cursor: pointer;
    user-select: none;
  }

  /* Locked-on Thinking remains visibly ON; only interaction is disabled. */
  .thinking-toggle.is-locked-on {
    cursor: default;
  }

  .toggle-switch {
    width: 32px; height: 18px;
    background: var(--border);
    border-radius: 9px;
    position: relative;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .toggle-switch.on { background: var(--accent); }

  .toggle-switch::after {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    background: white;
    border-radius: 50%;
    top: 2px; left: 2px;
    transition: left 0.2s;
  }

  .toggle-switch.on::after { left: 16px; }

  .topbar-sep {
    width: 1px; height: 18px;
    background: var(--border);
    flex-shrink: 0;
    display: none;
  }

  #effortSelect {
    min-width: 86px;
  }

  /* CHAT AREA */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 28px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 72%;
    gap: 4px;
    animation: fadeUp 0.2s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes bubblePop {
    0%   { opacity: 0; transform: scale(0.88) translateY(6px); }
    60%  { transform: scale(1.03) translateY(-1px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  body.skin-warm .msg { animation: bubblePop 0.28s cubic-bezier(0.34,1.56,0.64,1) both; }
  body.skin-warm .msg.user .bubble:active { transform: scale(0.97); transition: transform 0.1s; }
  body.skin-warm .send-btn { transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s; }
  body.skin-warm .send-btn:hover:not(:disabled) { transform: scale(1.08); box-shadow: 0 4px 14px rgba(92,122,78,0.45); }
  body.skin-warm .send-btn:active:not(:disabled) { transform: scale(0.93); }
  body.skin-warm .new-chat-btn { transition: opacity 0.2s, transform 0.15s; }
  body.skin-warm .new-chat-btn:hover { opacity: 1; transform: translateY(-1px); box-shadow: 0 3px 10px rgba(92,122,78,0.22); }
  body.skin-warm .chat-item { transition: background 0.15s, transform 0.12s; }
  body.skin-warm .chat-item:hover { transform: translateX(2px); }

  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.ai   { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 12px 16px;
    border-radius: 20px;
    font-size: 15px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user .bubble {
    background: var(--bubble-user);
    border-bottom-right-radius: 5px;
  }

  .msg.ai .bubble {
    background: var(--bubble-ai);
    border-bottom-left-radius: 5px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  /* 思考链展示 */
  .thinking-block {
    background: var(--hover);
    border-left: 2px solid var(--accent);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--text-soft);
    font-family: 'Helvetica Neue', sans-serif;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    max-width: 72%;
    align-self: flex-start;
    animation: fadeUp 0.2s ease;
  }

  .thinking-label {
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 6px;
    font-weight: 500;
  }

  .msg-time {
    font-size: 11px;
    color: var(--text-soft);
    font-family: 'Helvetica Neue', sans-serif;
    padding: 0 4px;
  }

  .typing {
    display: flex;
    gap: 5px;
    padding: 13px 16px;
    align-items: center;
  }

  .typing span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-soft);
    animation: blink 1.2s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40%           { opacity: 1; transform: scale(1); }
  }

  .empty-hint {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-soft);
    font-size: 14px;
    gap: 8px;
    font-family: 'Helvetica Neue', sans-serif;
  }

  .empty-hint .icon { font-size: 28px; opacity: 0.35; }

  /* INPUT */
  footer {
    padding: 10px 20px 18px;
  }

  .status-bar {
    font-size: 11px;
    font-family: 'Helvetica Neue', sans-serif;
    color: var(--text-soft);
    min-height: 16px;
    margin-bottom: 6px;
    padding: 0 4px;
  }

  .status-bar.ok { color: #7A9E7E; }
  .status-bar.err { color: #C47A6A; }

  .request-failure {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
  }

  .retry-btn {
    width: 22px;
    height: 22px;
    padding: 2px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: currentColor;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s, transform 0.1s;
  }

  .retry-btn:hover { background: var(--hover); }
  .retry-btn:active { transform: scale(0.92); }
  .retry-btn:disabled { opacity: 0.35; cursor: default; }
  .retry-btn svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px 10px 10px 16px;
    transition: border-color 0.2s;
  }

  .input-row:focus-within { border-color: var(--accent); }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    font-size: 15px;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    color: var(--text);
    line-height: 1.6;
    max-height: 130px;
    overflow-y: auto;
  }

  textarea::placeholder { color: var(--text-soft); }

  .send-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s, transform 0.1s;
  }

  .send-btn:hover { opacity: 0.85; }
  .send-btn:active { transform: scale(0.92); }
  .send-btn:disabled { opacity: 0.35; cursor: default; }
  .send-btn svg { width: 15px; height: 15px; fill: var(--bg); }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--input-bg);
    border-radius: 16px;
    padding: 24px;
    width: 90%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  }

  .modal h2 {
    font-size: 16px;
    font-weight: normal;
    color: var(--accent);
  }

  .modal p {
    font-size: 13px;
    color: var(--text-soft);
    font-family: 'Helvetica Neue', sans-serif;
    line-height: 1.5;
  }

  .modal input, .modal textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: 'Helvetica Neue', sans-serif;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    resize: vertical;
  }

  .modal input:focus, .modal textarea:focus { border-color: var(--accent); }

  .modal-btns {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .btn-cancel {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-family: 'Helvetica Neue', sans-serif;
    color: var(--text-soft);
    cursor: pointer;
  }

  .btn-save {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    font-family: 'Helvetica Neue', sans-serif;
    color: var(--bg);
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .btn-save:hover { opacity: 0.85; }

  @media (max-width: 580px) {
    .sidebar { width: 180px; min-width: 180px; }
    .chat-area { padding: 14px; }
  }

  /* 语音播放按钮 */
  .play-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 6px;
    padding: 4px 10px 4px 8px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-soft);
    font-size: 12px;
    font-family: 'Helvetica Neue', sans-serif;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    user-select: none;
  }
  .play-btn:hover { background: var(--hover); color: var(--text); }
  .play-btn.playing { color: var(--accent); border-color: var(--accent); }
  .play-btn svg { width: 12px; height: 12px; fill: currentColor; flex-shrink: 0; }

  /* AI气泡里英文+中文分区 */
  .bubble-en { font-size: 14.5px; line-height: 1.7; }
  .bubble-zh { font-size: 13px; color: var(--text-soft); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); line-height: 1.65; }
</style>
</head>
<body class="skin-warm">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-header">
    <h1>Claude</h1>
    <button class="new-chat-btn" onclick="newChat()">＋ 新对话</button>
  </div>
  <div class="chat-list" id="chatList"></div>
  <div class="sidebar-footer">
    <div class="skin-label">外观</div>
    <div class="skin-row">
      <div class="skin-dot dot-warm selected" title="自然绿" onclick="setSkin('warm')"></div>
      <div class="skin-dot dot-dark" title="墨夜" onclick="setSkin('dark')"></div>
      <div class="skin-dot dot-wa" title="WhatsApp" onclick="setSkin('wa')"></div>
    </div>
    <button class="sidebar-btn" onclick="exportChats()">💾 导出聊天记录</button>
    <button class="sidebar-btn" onclick="document.getElementById('importFile').click()">📂 导入聊天记录</button>
    <button class="sidebar-btn" onclick="openMemory()">🧠 记忆设置</button>
    <button class="sidebar-btn" onclick="openKey()">🔑 API Key</button>
    <button class="sidebar-btn" onclick="openElKey()">🔊 语音 Key</button>
    <button class="sidebar-btn" onclick="openTrash()">🗑 回收站</button>
  </div>
</div>

<input type="file" id="importFile" accept=".json" style="display:none" onchange="importChats(event)">

<!-- MAIN -->
<div class="main">
  <!-- 顶部工具栏：UI 只渲染 ModelRegistry / capability state，不决定 API 能力 -->
  <div class="topbar">
    <select id="modelSelect" onchange="onModelChange()"></select>
    <div class="topbar-sep" id="modelCapabilitySep"></div>
    <div class="model-control" id="thinkingControl">
      <span class="control-label">Thinking</span>
      <div class="thinking-toggle" id="thinkingToggle" onclick="toggleThinking()" role="button" tabindex="0" aria-label="切换 Thinking">
        <div class="toggle-switch" id="thinkingSwitch"></div>
      </div>
      <span class="thinking-type" id="thinkingTypeLabel"></span>
    </div>
    <div class="model-control" id="effortControl">
      <span class="control-label">Effort</span>
      <select id="effortSelect" onchange="onEffortChange()"></select>
    </div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="empty-hint" id="emptyHint">
      <div class="icon">✦</div>
      <div>开始一段新对话</div>
    </div>
  </div>

  <footer>
    <div class="status-bar" id="statusBar"></div>

<script>
  const API_URL = 'https://api.anthropic.com/v1/messages';
  const MODELS_URL = 'https://api.anthropic.com/v1/models?limit=1000';
  const MODEL_CACHE_KEY = 'claude_model_registry_v1';
  const MODEL_PREFS_KEY = 'claude_model_prefs_v1';
  const MODEL_SELECTION_KEY = 'claude_model';
  const EFFORT_LEVEL_ORDER = ['low', 'medium', 'high', 'xhigh', 'max'];

  // Offline/first-load fallback only. A successful GET /v1/models replaces this list.
  // Capabilities here intentionally cover only the controls this frontend needs.
  const FALLBACK_MODELS = [
    { id: 'claude-fable-5', display_name: 'Claude Fable 5', capabilities: { thinking: { supported: true, types: { adaptive: { supported: true } } }, effort: { supported: true, low: { supported: true }, medium: { supported: true }, high: { supported: true }, xhigh: { supported: true }, max: { supported: true } } } },
    { id: 'claude-opus-5', display_name: 'Claude Opus 5', capabilities: { thinking: { supported: true, types: { adaptive: { supported: true } } }, effort: { supported: true, low: { supported: true }, medium: { supported: true }, high: { supported: true }, xhigh: { supported: true }, max: { supported: true } } } },
    { id: 'claude-sonnet-5', display_name: 'Claude Sonnet 5', capabilities: { thinking: { supported: true, types: { adaptive: { supported: true } } }, effort: { supported: true, low: { supported: true }, medium: { supported: true }, high: { supported: true }, xhigh: { supported: true }, max: { supported: true } } } },
    { id: 'claude-opus-4-8', display_name: 'Claude Opus 4.8', capabilities: { thinking: { supported: true, types: { adaptive: { supported: true } } }, effort: { supported: true, low: { supported: true }, medium: { supported: true }, high: { supported: true }, xhigh: { supported: true }, max: { supported: true } } } },
    { id: 'claude-opus-4-7', display_name: 'Claude Opus 4.7', capabilities: { thinking: { supported: true, types: { adaptive: { supported: true } } }, effort: { supported: true, low: { supported: true }, medium: { supported: true }, high: { supported: true }, xhigh: { supported: true }, max: { supported: true } } } },
    { id: 'claude-opus-4-6', display_name: 'Claude Opus 4.6', capabilities: { thinking: { supported: true, types: { adaptive: { supported: true }, enabled: { supported: true } } }, effort: { supported: true, low: { supported: true }, medium: { supported: true }, high: { supported: true }, max: { supported: true } } } },
    { id: 'claude-opus-4-5-20251101', display_name: 'Claude Opus 4.5', capabilities: { thinking: { supported: true, types: { enabled: { supported: true } } }, effort: { supported: true, low: { supported: true }, medium: { supported: true }, high: { supported: true } } } },
    { id: 'claude-sonnet-4-6', display_name: 'Claude Sonnet 4.6', capabilities: { thinking: { supported: true, types: { adaptive: { supported: true }, enabled: { supported: true } } }, effort: { supported: true, low: { supported: true }, medium: { supported: true }, high: { supported: true }, max: { supported: true } } } },
    { id: 'claude-sonnet-4-5-20250929', display_name: 'Claude Sonnet 4.5', capabilities: { thinking: { supported: true, types: { enabled: { supported: true } } }, effort: { supported: false } } },
    { id: 'claude-haiku-4-5-20251001', display_name: 'Claude Haiku 4.5', capabilities: { thinking: { supported: true, types: { enabled: { supported: true } } }, effort: { supported: false } } }
  ];

  let apiKey = localStorage.getItem('claude_key') || '';
  let memory = localStorage.getItem('claude_memory') || '';
  let chats = JSON.parse(localStorage.getItem('claude_chats') || '{}');
  let chatOrder = JSON.parse(localStorage.getItem('claude_order') || '[]');
  let currentId = null;
  let isLoading = false;
  let activeRequestChatId = null;
  // Transient UI status revision must exist before Init can call loadChat()/status renderers.
  let statusRevision = 0;
  let thinkingOn = false;
  let selectedEffort = 'default';
  let selectedModelId = localStorage.getItem(MODEL_SELECTION_KEY) || '';
  let modelPrefs = JSON.parse(localStorage.getItem(MODEL_PREFS_KEY) || '{}');
  let modelRegistry = [];
  let elKey = localStorage.getItem('el_key') || '';
  const EL_VOICE = '0qHbGTWOPgPUvThY4Te6';
  let currentAudio = null;
  let currentSkin = localStorage.getItem('claude_skin') || 'warm';
  let audioDB = null;

  (function openAudioDB() {
    const req = indexedDB.open('claude_audio', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('audio', { keyPath: 'key' });
    req.onsuccess = e => {
      audioDB = e.target.result;
      retryPendingAudioCleanup();
    };
  })();

  function getAudio(key) {
    return new Promise(resolve => {
      if (!audioDB) return resolve(null);
      const req = audioDB.transaction('audio').objectStore('audio').get(key);
      req.onsuccess = e => resolve(e.target.result?.blob || null);
      req.onerror = () => resolve(null);
    });
  }

  function putAudio(key, blob) {
    if (!audioDB) return;
    try {
      audioDB.transaction('audio', 'readwrite').objectStore('audio').put({ key, blob });
    } catch (_) {}
  }

  // ── AUDIO STORAGE ADAPTER (P0-2) ──
  // Chat lifecycle domain never touches IndexedDB transactions directly.
  const AudioStorage = {
    get(key) { return getAudio(key); },
    put(key, blob) { return putAudio(key, blob); },
    deleteByChatId(chatId) {
      return new Promise(resolve => {
        if (!audioDB) return resolve(false);
        try {
          const store = audioDB.transaction('audio', 'readwrite').objectStore('audio');
          const req = store.openCursor();
          req.onsuccess = e => {
            const cursor = e.target.result;
            if (!cursor) return resolve(true);
            if (String(cursor.key).startsWith(chatId + '_')) cursor.delete();
            cursor.continue();
          };
          req.onerror = () => resolve(false);
        } catch (_) { resolve(false); }
      });
    }
  };

  // ── 皮肤 ─────────────────────────────────────────────
  function setSkin(name) {
    currentSkin = name;
    localStorage.setItem('claude_skin', name);
    applySkin(name);
  }

  function applySkin(name) {
    document.body.className = 'skin-' + name;
    document.querySelectorAll('.skin-dot').forEach(d => {
      d.classList.toggle('selected', d.classList.contains('dot-' + name));
    });
  }

  // ── MODEL REGISTRY / THINKING / EFFORT ─────────────────
  // Architecture rule: API/model capability logic lives here; the topbar only renders
  // state and forwards user choices. No generation behavior is inferred from UI shape.

  function loadModelRegistryCache() {
    try {
      const parsed = JSON.parse(localStorage.getItem(MODEL_CACHE_KEY) || 'null');
      return parsed && Array.isArray(parsed.models) ? parsed : null;
    } catch (_) { return null; }
  }

  function saveModelRegistryCache(models) {
    localStorage.setItem(MODEL_CACHE_KEY, JSON.stringify({
      fetchedAt: Date.now(),
      models
    }));
  }

  function normalizeModelInfo(model) {
    const fallback = FALLBACK_MODELS.find(item => item.id === model.id);
    const hasCapabilities = model.capabilities && Object.keys(model.capabilities).length > 0;
    return {
      id: model.id,
      display_name: model.display_name || model.id,
      capabilities: hasCapabilities ? model.capabilities : (fallback?.capabilities || {}),
      created_at: model.created_at || null,
      max_input_tokens: model.max_input_tokens ?? null,
      max_tokens: model.max_tokens ?? null
    };
  }

  function registryCapabilitySignature(models) {
    return JSON.stringify((models || []).map(model => {
      const thinking = model.capabilities?.thinking || null;
      const effort = model.capabilities?.effort || null;
      return {
        id: model.id,
        thinking,
        effort
      };
    }));
  }

  function initializeModelRegistry() {
    const cached = loadModelRegistryCache();
    modelRegistry = cached?.models?.length
      ? cached.models.map(normalizeModelInfo)
      : FALLBACK_MODELS.map(normalizeModelInfo);

    if (!selectedModelId) {
      const safeDefault = modelRegistry.find(m => m.id === 'claude-sonnet-4-6')
        || modelRegistry.find(m => m.id === 'claude-sonnet-5')
        || modelRegistry[0];
      if (safeDefault) {
        selectedModelId = safeDefault.id;
        localStorage.setItem(MODEL_SELECTION_KEY, selectedModelId);
      }
    }

    renderModelSelect();
    applySelectedModelPreferences();
    renderModelCapabilityControls();
  }

  async function refreshModelRegistry() {
    if (!apiKey) return { ok: false, reason: 'NO_API_KEY' };
    const previousCache = loadModelRegistryCache();

    try {
      const res = await fetch(MODELS_URL, {
        method: 'GET',
        headers: {
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        }
      });
      if (!res.ok) return { ok: false, reason: `HTTP_${res.status}` };

      const payload = await res.json();
      const models = (payload.data || [])
        .filter(m => m && typeof m.id === 'string')
        .map(normalizeModelInfo);
      if (!models.length) return { ok: false, reason: 'EMPTY_MODEL_LIST' };

      const changed = !!previousCache?.models?.length &&
        registryCapabilitySignature(previousCache.models) !== registryCapabilitySignature(models);

      modelRegistry = models;
      saveModelRegistryCache(models);
      renderModelSelect();
      applySelectedModelPreferences();
      renderModelCapabilityControls();
      updateSendAvailability();

      if (selectedModelId && !getModelInfo(selectedModelId)) {
        setStatus('当前模型已不可用，请重新选择', 'err');
      } else if (changed) {
        flashStatus('模型能力已更新', 'ok', 2200);
      }
      return { ok: true, changed };
    } catch (_) {
      // Network/model-registry failure must not break chat. Cached/fallback models remain usable.
      return { ok: false, reason: 'NETWORK' };
    }
  }

  function getModelInfo(modelId) {
    return modelRegistry.find(model => model.id === modelId) || null;
  }

  function getSupportedEffortLevels(modelInfo) {
    const effort = modelInfo?.capabilities?.effort;
    if (!effort?.supported) return [];
    return EFFORT_LEVEL_ORDER.filter(level => effort[level]?.supported === true);
  }

  // Models API exposes supported thinking types, but does not currently encode every
  // default/disable rule. This small policy layer handles those semantics while the
  // live registry remains the source of truth for model availability and capabilities.
  function getKnownThinkingPolicy(modelId) {
    if (/^claude-(fable|mythos)-(?:5|5-1)(?:-\d{8})?$/.test(modelId)) {
      return { mode: 'adaptive', defaultState: 'always_on', canToggle: false };
    }
    if (/^claude-mythos-preview(?:-\d{8})?$/.test(modelId)) {
      return { mode: 'adaptive', defaultState: 'always_on', canToggle: false };
    }
    if (/^claude-opus-5(?:-\d{8})?$/.test(modelId)) {
      return {
        mode: 'adaptive', defaultState: 'on', canToggle: true,
        offStrategy: 'disabled', offForbiddenEfforts: ['xhigh', 'max']
      };
    }
    if (/^claude-sonnet-5(?:-\d{8})?$/.test(modelId)) {
      return { mode: 'adaptive', defaultState: 'on', canToggle: true, offStrategy: 'disabled' };
    }
    if (/^claude-opus-4-(8|7)(?:-\d{8})?$/.test(modelId)) {
      return { mode: 'adaptive', defaultState: 'off', canToggle: true, offStrategy: 'omit' };
    }
    if (/^claude-(opus|sonnet)-4-6(?:-\d{8})?$/.test(modelId)) {
      return { mode: 'adaptive', defaultState: 'off', canToggle: true, offStrategy: 'omit' };
    }
    if (/^claude-(opus|sonnet|haiku)-4-5(?:-\d{8})?$/.test(modelId)) {
      return { mode: 'enabled', defaultState: 'off', canToggle: true, offStrategy: 'omit', budgetTokens: 10000 };
    }
    return null;
  }

  function resolveModelControls(modelInfo) {
    if (!modelInfo) {
      return {
        thinkingSupported: false, thinkingMode: null, canToggleThinking: false,
        thinkingDefaultOn: false, thinkingAlwaysOn: false, offStrategy: 'omit',
        offForbiddenEfforts: [], effortLevels: []
      };
    }

    const thinking = modelInfo.capabilities?.thinking || {};
    const types = thinking.types || {};
    const thinkingSupported = thinking.supported === true;
    const known = getKnownThinkingPolicy(modelInfo.id);
    const inferredMode = types.adaptive?.supported ? 'adaptive'
      : types.enabled?.supported ? 'enabled'
      : null;
    const thinkingMode = thinkingSupported ? (known?.mode || inferredMode) : null;
    const explicitDisabledSupport = types.disabled?.supported === true;
    const canToggleThinking = thinkingSupported && !!thinkingMode &&
      (known ? known.canToggle : explicitDisabledSupport);
    const thinkingAlwaysOn = thinkingSupported && known?.defaultState === 'always_on';
    const thinkingDefaultOn = thinkingAlwaysOn || (thinkingSupported && known?.defaultState === 'on');

    return {
      thinkingSupported,
      thinkingMode,
      canToggleThinking,
      thinkingDefaultOn,
      thinkingAlwaysOn,
      offStrategy: known?.offStrategy || (explicitDisabledSupport ? 'disabled' : 'omit'),
      offForbiddenEfforts: known?.offForbiddenEfforts || [],
      budgetTokens: known?.budgetTokens || 10000,
      effortLevels: getSupportedEffortLevels(modelInfo)
    };
  }

  function renderModelSelect() {
    const select = document.getElementById('modelSelect');
    if (!select) return;
    select.innerHTML = '';

    const selectedExists = !!getModelInfo(selectedModelId);
    if (selectedModelId && !selectedExists) {
      const unavailable = document.createElement('option');
      unavailable.value = selectedModelId;
      unavailable.textContent = `${selectedModelId}（不可用）`;
      unavailable.disabled = true;
      unavailable.selected = true;
      select.appendChild(unavailable);
    }

    modelRegistry.forEach(model => {
      const option = document.createElement('option');
      option.value = model.id;
      option.textContent = model.display_name || model.id;
      option.title = model.id;
      select.appendChild(option);
    });

    if (selectedExists) select.value = selectedModelId;
  }

  function getModelPreference(modelId, controls) {
    const stored = modelPrefs[modelId] || {};
    const thinkingEnabled = controls.thinkingAlwaysOn
      ? true
      : typeof stored.thinkingEnabled === 'boolean'
        ? stored.thinkingEnabled
        : controls.thinkingDefaultOn;
    const effort = controls.effortLevels.includes(stored.effort) ? stored.effort : 'default';
    return { thinkingEnabled, effort };
  }

  function saveSelectedModelPreference() {
    if (!selectedModelId) return;
    modelPrefs[selectedModelId] = {
      ...(modelPrefs[selectedModelId] || {}),
      thinkingEnabled: thinkingOn,
      effort: selectedEffort
    };
    localStorage.setItem(MODEL_PREFS_KEY, JSON.stringify(modelPrefs));
  }

  function applySelectedModelPreferences() {
    const modelInfo = getModelInfo(selectedModelId);
    const controls = resolveModelControls(modelInfo);
    const pref = getModelPreference(selectedModelId, controls);
    thinkingOn = pref.thinkingEnabled;
    selectedEffort = pref.effort;

    // Never restore a persisted combination that the current API contract rejects.
    if (!thinkingOn && controls.offForbiddenEfforts.includes(selectedEffort)) {
      selectedEffort = 'default';
      saveSelectedModelPreference();
    }
  }

  function canDisableThinkingAtEffort(controls, effort) {
    if (!controls.canToggleThinking) return false;
    if (!thinkingOn) return true;
    return !controls.offForbiddenEfforts.includes(effort);
  }

  function renderModelCapabilityControls() {
    const modelInfo = getModelInfo(selectedModelId);
    const controls = resolveModelControls(modelInfo);
    const thinkingControl = document.getElementById('thinkingControl');
    const effortControl = document.getElementById('effortControl');
    const sep = document.getElementById('modelCapabilitySep');
    const toggle = document.getElementById('thinkingToggle');
    const switchEl = document.getElementById('thinkingSwitch');
    const typeLabel = document.getElementById('thinkingTypeLabel');
    const effortSelect = document.getElementById('effortSelect');

    // UI projection only: the policy layer above decides whether Thinking exists,
    // whether it is always-on, and whether the current effort allows disabling it.
    // The renderer only visualizes that state.
    const showThinking = controls.thinkingAlwaysOn || controls.canToggleThinking;
    thinkingControl.style.display = showThinking ? 'flex' : 'none';
    if (showThinking) {
      const effectiveThinkingOn = controls.thinkingAlwaysOn ? true : thinkingOn;
      const lockedByPolicy = controls.thinkingAlwaysOn;
      const lockedByEffort = effectiveThinkingOn && controls.canToggleThinking &&
        !canDisableThinkingAtEffort(controls, selectedEffort);
      const lockedOn = lockedByPolicy || lockedByEffort;

      switchEl.classList.toggle('on', effectiveThinkingOn);
      typeLabel.textContent = controls.thinkingMode === 'adaptive' ? 'Adaptive' : 'Extended';
      toggle.classList.toggle('is-locked-on', lockedOn);
      toggle.setAttribute('aria-pressed', String(effectiveThinkingOn));
      toggle.setAttribute('aria-disabled', String(lockedOn));
      toggle.tabIndex = lockedOn ? -1 : 0;
      toggle.title = lockedByPolicy
        ? '此模型始终启用 Thinking'
        : lockedByEffort
          ? '当前 Effort 需要保持 Thinking 开启'
          : '';
    } else {
      toggle.classList.remove('is-locked-on');
      toggle.removeAttribute('aria-disabled');
      toggle.tabIndex = 0;
      toggle.title = '';
    }

    const showEffort = controls.effortLevels.length > 0;
    effortControl.style.display = showEffort ? 'flex' : 'none';
    effortSelect.innerHTML = '';
    if (showEffort) {
      const defaultOption = document.createElement('option');
      defaultOption.value = 'default';
      defaultOption.textContent = '默认';
      effortSelect.appendChild(defaultOption);

      controls.effortLevels.forEach(level => {
        const option = document.createElement('option');
        option.value = level;
        option.textContent = level === 'xhigh' ? 'XHigh' : level === 'max' ? 'Max' : level[0].toUpperCase() + level.slice(1);
        if (!thinkingOn && controls.offForbiddenEfforts.includes(level)) option.disabled = true;
        effortSelect.appendChild(option);
      });
      effortSelect.value = controls.effortLevels.includes(selectedEffort) ? selectedEffort : 'default';
    }

    sep.style.display = (showThinking || showEffort) ? 'block' : 'none';
  }

  function updateSendAvailability() {
    const hasUsableModel = !!selectedModelId && !!getModelInfo(selectedModelId);
    document.getElementById('sendBtn').disabled = !apiKey || isLoading || !hasUsableModel;
  }

  function onModelChange() {
    const model = document.getElementById('modelSelect').value;
    if (!model || !getModelInfo(model)) return;
    selectedModelId = model;
    localStorage.setItem(MODEL_SELECTION_KEY, selectedModelId);
    applySelectedModelPreferences();
    renderModelCapabilityControls();
    updateSendAvailability();
    setStatus('');
  }

  function toggleThinking() {
    const controls = resolveModelControls(getModelInfo(selectedModelId));
    if (!controls.canToggleThinking) return;
    if (thinkingOn && !canDisableThinkingAtEffort(controls, selectedEffort)) {
      flashStatus('当前 Effort 需要保持 Thinking 开启', 'err', 2200);
      return;
    }
    thinkingOn = !thinkingOn;
    saveSelectedModelPreference();
    renderModelCapabilityControls();
  }

  function onEffortChange() {
    const controls = resolveModelControls(getModelInfo(selectedModelId));
    const value = document.getElementById('effortSelect').value;
    if (value !== 'default' && !controls.effortLevels.includes(value)) return;
    if (!thinkingOn && controls.offForbiddenEfforts.includes(value)) return;
    selectedEffort = value;
    saveSelectedModelPreference();
    renderModelCapabilityControls();
  }

  document.getElementById('thinkingToggle').addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      toggleThinking();
    }
  });

  // ── SIDEBAR ──────────────────────────────────────────
  function renderSidebar() {
    const list = document.getElementById('chatList');
    list.innerHTML = '';
    chatOrder.forEach(id => {
      const chat = chats[id];
      if (!chat) return;
      const div = document.createElement('div');
      div.className = 'chat-item' + (id === currentId ? ' active' : '');
      div.innerHTML = `
        <span class="chat-item-title">${escHtml(chat.title || '新对话')}</span>
        <button class="chat-item-del" onclick="openChatActions(event,'${id}')" title="更多操作">⋯</button>
      `;
      div.addEventListener('click', () => loadChat(id));
      list.appendChild(div);
    });
  }

  function newChat() {
    const id = makeChatId();
    const now = Date.now();
    chats[id] = {
      title: '新对话',
      createdAt: now,
      createdTimeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      updatedAt: now,
      messages: []
    };
    chatOrder.unshift(id);
    save();
    loadChat(id);
  }

  function loadChat(id) {
    currentId = id;
    renderSidebar();
    const area = document.getElementById('chatArea');
    area.innerHTML = '';
    const chat = chats[id];
    if (!chat || chat.messages.length === 0) {
      area.innerHTML = `<div class="empty-hint"><div class="icon">✦</div><div>开始一段新对话</div></div>`;
      syncRequestStatusForChat(id);
      return;
    }
    chat.messages.forEach((m, i) => {
      if (m.role === 'thinking') renderThinking(m.content, false);
      else renderMsg(m.role === 'assistant' ? 'ai' : m.role, m, false, i);
    });
    area.scrollTop = area.scrollHeight;
    syncRequestStatusForChat(id);
  }

  // ── PER-CHAT ACTIONS (UI controller layer) ──
  // Generic actions entry — NOT bound to "delete" only. First version has a single
  // action; future items (rename / export single chat / clear audio cache) can be
  // added here without touching the domain lifecycle functions below.
  function openChatActions(event, chatId) {
    event.stopPropagation(); // must not trigger loadChat
    if (confirm('删除到回收站？')) {
      handleMoveChatToTrash(chatId);
    }
  }

  function handleMoveChatToTrash(chatId) {
    const result = moveChatToTrash(chatId);
    if (!result.ok) return;
    if (currentId === chatId) {
      currentId = null;
      document.getElementById('chatArea').innerHTML =
        `<div class="empty-hint"><div class="icon">✦</div><div>开始一段新对话</div></div>`;
    }
    renderSidebar();
    flashStatus('已移至回收站 ✓', 'ok', 2000);
  }

  // ── MESSAGES ─────────────────────────────────────────
  function parseAiReply(text) {
    const enMatch = text.match(/\[EN\]\s*([\s\S]*?)(?=\[ZH\]|$)/);
    const zhMatch = text.match(/\[ZH\]\s*([\s\S]*?)$/);
    return {
      en: enMatch ? enMatch[1].trim() : '',
      zh: zhMatch ? zhMatch[1].trim() : text.trim()
    };
  }

  function renderMsg(role, msgOrText, animate = true, msgIndex = -1) {
    const area = document.getElementById('chatArea');
    const hint = document.getElementById('emptyHint');
    if (hint) hint.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    if (!animate) div.style.animation = 'none';

    if (role === 'ai' || role === 'assistant') {
      const msg = typeof msgOrText === 'object' ? msgOrText : null;
      const rawText = msg ? msg.content : msgOrText;
      const en = msg?.en ?? parseAiReply(rawText).en;
      const zh = msg?.zh ?? parseAiReply(rawText).zh;
      const hasVoice = !!en && !!elKey;
      div.innerHTML = `
        <div class="bubble">
          ${en ? `<div class="bubble-en">${escHtml(en)}</div>` : ''}
          <div class="bubble-zh">${escHtml(zh || rawText)}</div>
        </div>
        ${hasVoice ? `<button class="play-btn" data-msg-id="${msg?.id || ''}" data-index="${msgIndex}" onclick="playVoice(this)">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 播放
        </button>` : ''}
        <div class="msg-time">${msg ? formatMessageTimestamp(msg) : '时间未知'}</div>`;
    } else {
      const msgObj = typeof msgOrText === 'object' ? msgOrText : null;
      const text = msgObj ? msgObj.content : msgOrText;
      div.innerHTML = `<div class="bubble">${escHtml(text)}</div><div class="msg-time">${msgObj ? formatMessageTimestamp(msgObj) : '时间未知'}</div>`;
    }

    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  function renderThinking(text, animate = true) {
    const area = document.getElementById('chatArea');
    const hint = document.getElementById('emptyHint');
    if (hint) hint.remove();
    const div = document.createElement('div');
    div.className = 'thinking-block';
    if (!animate) div.style.animation = 'none';
    div.innerHTML = `<div class="thinking-label">✦ 思考过程</div>${escHtml(text)}`;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  function addTyping() {
    const area = document.getElementById('chatArea');
    const hint = document.getElementById('emptyHint');
    if (hint) hint.remove();
    const div = document.createElement('div');
    div.className = 'msg ai'; div.id = 'typing';
    div.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span></div>`;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  // ── GENERATION / RETRY (P0-2.5) ─────────────────────
  // Domain predicate only: no DOM access and no persisted request-state fields.
  // The latest non-thinking message being a user turn is enough to derive that
  // the latest turn has not yet received an assistant reply.
  function getLatestUnresolvedUserTurn(chat) {
    if (!chat || !Array.isArray(chat.messages)) return null;
    for (let i = chat.messages.length - 1; i >= 0; i--) {
      const message = chat.messages[i];
      if (message.role === 'thinking') continue;
      return message.role === 'user' ? { message, index: i } : null;
    }
    return null;
  }

  function buildSystemPrompt() {
    let system = '你是一个有真实感的对话伙伴，男性，有自己的性格和想法。每次回复用以下固定格式，不要加任何额外说明：\n\n[EN]\n（英文回复，自然口语，带情绪，不超过4句）\n\n[ZH]\n（完全相同意思的中文版，自然流畅）\n\n思考过程如果有，也请用中文。';
    if (memory.trim()) system += '\n\n关于用户的背景信息：\n' + memory.trim();
    return system;
  }

  // UI/config adapter. Generation service receives plain data and does not read DOM.
  function getCurrentGenerationConfig() {
    const modelInfo = getModelInfo(selectedModelId);
    if (!modelInfo) return null;
    const controls = resolveModelControls(modelInfo);
    return {
      model: selectedModelId,
      modelInfo,
      controls,
      thinkingEnabled: controls.thinkingAlwaysOn ? true : thinkingOn,
      effort: selectedEffort
    };
  }

  function getRequestMaxTokens(config) {
    const thinkingMayRun = config.controls.thinkingSupported && (
      config.controls.thinkingAlwaysOn ||
      config.controls.thinkingDefaultOn ||
      config.thinkingEnabled ||
      !config.controls.canToggleThinking
    );
    const desired = thinkingMayRun ? 16000 : 1024;
    const modelMax = Number(config.modelInfo?.max_tokens);
    return Number.isFinite(modelMax) && modelMax >= 1024 ? Math.min(desired, modelMax) : desired;
  }

  function applyThinkingAndEffortToBody(body, config) {
    const controls = config.controls;
    const effort = config.effort;

    if (effort !== 'default' && controls.effortLevels.includes(effort)) {
      body.output_config = { ...(body.output_config || {}), effort };
    }

    if (!controls.thinkingSupported || !controls.thinkingMode) return;

    // Always-on models have no UI toggle, but request readable official summaries.
    if (controls.thinkingAlwaysOn) {
      body.thinking = { type: 'adaptive', display: 'summarized' };
      return;
    }

    if (!controls.canToggleThinking) {
      // Unknown future semantics: do not invent a disable/enable contract.
      return;
    }

    if (config.thinkingEnabled) {
      if (controls.thinkingMode === 'adaptive') {
        body.thinking = { type: 'adaptive', display: 'summarized' };
      } else if (controls.thinkingMode === 'enabled') {
        const maxTokens = body.max_tokens;
        const budget = Math.max(1024, Math.min(controls.budgetTokens, maxTokens - 1024));
        body.thinking = { type: 'enabled', budget_tokens: budget, display: 'summarized' };
      }
      return;
    }

    if (controls.offStrategy === 'disabled') {
      body.thinking = { type: 'disabled' };
    }
    // offStrategy === 'omit': model defaults to thinking off, so no field is sent.
  }

  function parseAnthropicResponse(data) {
    const thinkingParts = [];
    const textParts = [];
    const unknownBlockTypes = [];
    let officialThinkingBlockCount = 0;

    (data.content || []).forEach(block => {
      if (block?.type === 'thinking') {
        officialThinkingBlockCount++;
        if (typeof block.thinking === 'string' && block.thinking.trim()) {
          thinkingParts.push(block.thinking.trim());
        }
        return;
      }
      if (block?.type === 'redacted_thinking') {
        // Official Anthropic block, intentionally not rendered as readable thinking.
        return;
      }
      if (block?.type === 'text') {
        if (typeof block.text === 'string') textParts.push(block.text);
        return;
      }
      unknownBlockTypes.push(block?.type || 'unknown');
    });

    return {
      thinkingText: thinkingParts.join('\n\n'),
      replyText: textParts.join('\n'),
      officialThinkingBlockCount,
      unknownBlockTypes: [...new Set(unknownBlockTypes)],
      apiResponseId: data.id || null,
      responseModel: data.model || null
    };
  }

  // API service layer: builds/sends the request and returns structured data.
  // It does not render, mutate chat history, or decide how retry is presented.
  async function requestAssistantReply(chatId, config) {
    const chat = chats[chatId];
    if (!chat) return { ok: false, kind: 'state', error: '对话已不存在' };
    if (!config?.model) return { ok: false, kind: 'state', error: '没有可用模型' };

    const apiMessages = chat.messages
      .filter(m => m.role !== 'thinking')
      .map(({ role, content }) => ({ role, content }));

    const body = {
      model: config.model,
      max_tokens: getRequestMaxTokens(config),
      system: buildSystemPrompt(),
      messages: apiMessages
    };
    applyThinkingAndEffortToBody(body, config);

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        let err = null;
        try { err = await res.json(); } catch (_) {}
        return {
          ok: false,
          kind: 'api',
          error: err?.error?.message || `HTTP ${res.status}`
        };
      }

      const data = await res.json();
      const parsedResponse = parseAnthropicResponse(data);
      return { ok: true, ...parsedResponse };
    } catch (e) {
      return { ok: false, kind: 'network', error: e.message };
    }
  }

    // Persistence/domain commit. No DOM access.
  function commitAssistantReply(chatId, result, config) {
    const chat = chats[chatId];
    if (!chat) return { ok: false, reason: 'CHAT_NOT_FOUND' };

    let thinkingMessage = null;
    if (result.thinkingText) {
      thinkingMessage = {
        role: 'thinking',
        content: result.thinkingText,
        source: 'anthropic_api_thinking_block',
        thinkingDisplay: 'summarized',
        officialBlockCount: result.officialThinkingBlockCount || 1,
        model: result.responseModel || config.model,
        apiResponseId: result.apiResponseId || null,
        id: makeMessageId(),
        chatId,
        clientSeq: chat.messages.length,
        createdAt: Date.now(),
        createdTimeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
      };
      chat.messages.push(thinkingMessage);
    }

    const parsed = parseAiReply(result.replyText);
    const assistantMessage = {
      role: 'assistant',
      content: result.replyText,
      en: parsed.en,
      zh: parsed.zh,
      id: makeMessageId(),
      chatId,
      clientSeq: chat.messages.length,
      createdAt: Date.now(),
      createdTimeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
    };
    chat.messages.push(assistantMessage);
    chat.updatedAt = Date.now();
    save();

    return {
      ok: true,
      thinkingMessage,
      assistantMessage,
      assistantIndex: chat.messages.length - 1
    };
  }

    // Shared controller for both a fresh send and a retry. It owns transient UI
  // state but delegates API work and persistence to the layers above.
  async function generateAssistantReply(chatId) {
    if (!apiKey || isLoading || !chats[chatId]) return { ok: false, reason: 'NOT_READY' };

    const config = getCurrentGenerationConfig();
    if (!config) {
      if (currentId === chatId) flashStatus('请选择可用模型', 'err', 2200);
      return { ok: false, reason: 'NO_MODEL' };
    }

    isLoading = true;
    activeRequestChatId = chatId;
    updateSendAvailability();

    if (currentId === chatId) {
      showRequestPending();
      addTyping();
    }

    const result = await requestAssistantReply(chatId, config);

    if (currentId === chatId) removeTyping();

    let committed = null;
    if (result.ok) committed = commitAssistantReply(chatId, result, config);

    isLoading = false;
    activeRequestChatId = null;
    updateSendAvailability();

    if (!result.ok) {
      if (currentId === chatId) {
        const prefix = result.kind === 'network' ? '网络错误：' : '出错了：';
        showRequestFailure(prefix + result.error, chatId);
      } else if (currentId) {
        syncRequestStatusForChat(currentId);
      }
      return result;
    }

    if (!committed?.ok) {
      // Known low-probability edge: the chat may have been moved to trash while
      // the request was in flight. Do not couple retry to trash lifecycle here.
      if (currentId === chatId) showRequestFailure('回复未能写入当前对话', chatId);
      return { ok: false, kind: 'state', error: committed?.reason || 'COMMIT_FAILED' };
    }

    if (currentId === chatId) {
      if (committed.thinkingMessage) renderThinking(committed.thinkingMessage.content);
      renderMsg('ai', committed.assistantMessage, true, committed.assistantIndex);
      if (result.unknownBlockTypes?.length) {
        flashStatus(`Anthropic 响应包含未支持的新类型：${result.unknownBlockTypes.join(', ')}`, 'err', 4200);
      } else {
        showRequestSuccess();
      }
    } else {
      renderSidebar();
      if (currentId) syncRequestStatusForChat(currentId);
    }

    document.getElementById('input').focus();
    return { ok: true };
  }

  // Normal send creates exactly one user message, then calls the shared
  // generation controller. Retry never passes through this creation path.
  async function send() {
    if (!apiKey || isLoading) return;
    if (!getCurrentGenerationConfig()) { flashStatus('请选择可用模型', 'err', 2200); return; }
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;

    if (!currentId) newChat();

    // Lock the parent chat identity before any await.
    const requestChatId = currentId;
    const chat = chats[requestChatId];

    input.value = '';
    input.style.height = 'auto';

    const userMsg = {
      role: 'user',
      content: text,
      id: makeMessageId(),
      chatId: requestChatId,
      clientSeq: chat.messages.length,
      createdAt: Date.now(),
      createdTimeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
    };
    chat.messages.push(userMsg);
    if (chat.title === '新对话') chat.title = text.slice(0, 24) + (text.length > 24 ? '…' : '');
    chat.updatedAt = Date.now();
    save();

    if (currentId === requestChatId) renderMsg('user', userMsg);
    renderSidebar();

    await generateAssistantReply(requestChatId);
  }

  // UI controller entry point. It reuses the existing latest user turn and
  // therefore never duplicates user content, ids, timestamps, clientSeq, or chatId.
  async function handleRetryLatestReply(chatId) {
    if (!apiKey || isLoading) return;
    if (!getCurrentGenerationConfig()) { flashStatus('请选择可用模型', 'err', 2200); return; }
    const chat = chats[chatId];
    if (!getLatestUnresolvedUserTurn(chat)) {
      if (currentId === chatId) syncRequestStatusForChat(chatId);
      return;
    }
    await generateAssistantReply(chatId);
  }

  // ── 语音 ─────────────────────────────────────────────
  async function playVoice(btn) {
    const msgId = btn.dataset.msgId;
    const idx = parseInt(btn.dataset.index);
    const messages = chats[currentId]?.messages || [];
    const msg = (msgId ? messages.find(m => m.id === msgId) : null) ?? messages[idx] ?? null;
    const text = msg?.en || parseAiReply(msg?.content || '').en;
    if (!text) { setStatus('没有英文内容可播放', 'err'); return; }
    if (!elKey) { setStatus('请先在左下角设置语音 Key', 'err'); return; }

    // 如果正在播放，停止
    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
      document.querySelectorAll('.play-btn.playing').forEach(b => {
        b.classList.remove('playing');
        b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 播放';
      });
      if (btn.classList.contains('was-playing')) { btn.classList.remove('was-playing'); return; }
    }

    btn.classList.add('playing', 'was-playing');
    btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> 播放中…';

    const audioKey = msgId ? `${currentId}_${msgId}` : null;

    function playBlob(blob) {
      const url = URL.createObjectURL(blob);
      currentAudio = new Audio(url);
      currentAudio.play();
      setStatus('');
      currentAudio.onended = () => {
        btn.classList.remove('playing', 'was-playing');
        btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 再听';
        currentAudio = null;
        URL.revokeObjectURL(url);
      };
    }

    try {
      // 优先读缓存
      if (audioKey) {
        const cached = await getAudio(audioKey);
        if (cached) { playBlob(cached); return; }
      }

      setStatus('生成语音中…');
      const elUrl = `https://api.elevenlabs.io/v1/text-to-speech/${EL_VOICE}`;
      const res = await fetch(elUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'xi-api-key': elKey
        },
        body: JSON.stringify({
          text,
          model_id: 'eleven_turbo_v2_5',
          voice_settings: { stability: 0.4, similarity_boost: 0.75, style: 0.45, use_speaker_boost: true }
        })
      });

      if (!res.ok) {
        const err = await res.json();
        setStatus('语音出错：' + (err.detail?.message || res.status), 'err');
        btn.classList.remove('playing', 'was-playing');
        btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 播放';
        return;
      }

      const blob = await res.blob();
      if (audioKey) putAudio(audioKey, blob);
      playBlob(blob);

    } catch (e) {
      setStatus('语音网络错误：' + e.message, 'err');
      btn.classList.remove('playing', 'was-playing');
      btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 播放';
    }
  }
