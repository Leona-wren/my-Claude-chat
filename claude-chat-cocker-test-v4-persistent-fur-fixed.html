    const Cocker = (() => {
      // Persistent tiled renderer.
      // Background fur and edge fur are derived UI only: no storage, API or message writes.
      const CFG = {
        density: .76,
        len: 1.18,
        seed: 7,
        tileH: 960,

      let previousWidth = 0;

      let chatObserver = null;
      let nextElementId = 1;

      const elementIds = new WeakMap();

      const L = l => Math.max(4, Math.min(95, l + T.d));

        Math.sin(a)*(1-t)+Math.sin(b)*t,
        Math.cos(a)*(1-t)+Math.cos(b)*t

      function hash01(a,b=0,c=0,d0=0){
        let h = Math.imul((a|0) ^ 0x9e3779b9, 374761393);
        h = (h + Math.imul((b|0) ^ 0x85ebca6b, 668265263)) | 0;
        h = (h + Math.imul((c|0) ^ 0xc2b2ae35, 1442695041)) | 0;

      function noise(x,y){
        const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
        const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
        const a=hash01(xi,yi,11), b=hash01(xi+1,yi,11);
        const c=hash01(xi,yi+1,11), dd=hash01(xi+1,yi+1,11);
        return a+(b-a)*u+(c-a)*v+(a-b-c+dd)*u*v;
      }

      const flow=(x,y)=>Math.PI/2
        +(noise(x*.004,y*.004)-.5)*3.6
        +(noise(x*.014+40,y*.014)-.5)*.9;
      const bnd=(x,y)=>(noise(x*.02+70,y*.02)-.5)*1.1;
      const clump=(x,y)=>(noise(x*.02+9,y*.02+3)-.5)*14;

      function active(){

      function getElementId(el){
        let id = elementIds.get(el);

          elementIds.set(el,id);

      function ensure(){
        area = d.getElementById('chatArea');

        let rebuilt=false;

        bgStack = area.querySelector(':scope > .cocker-fur-stack');
        if(!bgStack){

          area.insertBefore(bgStack, area.firstChild);
          rebuilt=true;
        }

        edgeStack = area.querySelector(':scope > .cocker-edge-stack');
        if(!edgeStack){
          edgeStack=d.createElement('div');
          edgeStack.className='cocker-edge-stack';
          area.insertBefore(edgeStack, bgStack.nextSibling);
          rebuilt=true;
        }

        // loadChat() clears chatArea.innerHTML. If that removed our stacks,
        // discard stale canvas references and rebuild only the derived UI cache.
        if(rebuilt){
          bgTiles.clear();
          edgeTiles.clear();
        }
        return true;
      }

      // Layout coordinates deliberately ignore transient pop/scale animations.
      function layoutRect(el){
        let x=0,y=0,node=el,guard=0;
        while(node && node!==area && guard++<30){
          x += node.offsetLeft || 0;
          y += node.offsetTop || 0;
          node = node.offsetParent;
        }
        if(node!==area){
          const ar=area.getBoundingClientRect(), r=el.getBoundingClientRect();
          x=r.left-ar.left+area.scrollLeft;
          y=r.top-ar.top+area.scrollTop;
        }
        return {x,y,w:el.offsetWidth||0,h:el.offsetHeight||0};
      }

      function collectBoxes(){
        if(!area) return [];
        const selectors = [
          '.msg.user > .bubble',
          '.msg.ai > .bubble:not(.transcript-bubble)',
          '.msg.ai .voice-bar',
          '.msg.ai .transcript-bubble:not([hidden])'

        const result=[];
        area.querySelectorAll(selectors.join(',')).forEach(el=>{
          if(el.closest('.cocker-fur-stack,.cocker-edge-stack')) return;
          const r=layoutRect(el);
          if(r.w<4 || r.h<4) return;
          result.push({
            id:getElementId(el),
            el,
            x:r.x,y:r.y,w:r.w,h:r.h,
            r:Math.min(20,r.h/2)

      }

      function measureContentHeight(){
        const cs=w.getComputedStyle(area);
        const padBottom=parseFloat(cs.paddingBottom)||0;
        let bottom=area.clientHeight;
        for(const child of area.children){
          if(child===bgStack || child===edgeStack) continue;
          if(child.hidden) continue;
          const r=layoutRect(child);
          bottom=Math.max(bottom,r.y+r.h+padBottom);
        }
        return Math.ceil(bottom);
      }

      function sd(box,x,y,expand=0){
        const r=box.r+expand;
        const cx=box.x+box.w/2, cy=box.y+box.h/2;
        const qx=Math.abs(x-cx)-(box.w/2-box.r);
        const qy=Math.abs(y-cy)-(box.h/2-box.r);
        const ox=Math.max(qx,0), oy=Math.max(qy,0), ln=Math.hypot(ox,oy);
        const dist=ln+Math.min(Math.max(qx,qy),0)-r;
        let nx,ny;
        if(ln>0){
          nx=ox/ln*(x<cx?-1:1);
          ny=oy/ln*(y<cy?-1:1);
        }else if(qx>qy){
          nx=x<cx?-1:1; ny=0;
        }else{
          nx=0; ny=y<cy?-1:1;
        }
        return [dist,nx,ny];
      }

      function dent(x,y,a,len,lm,R){
        for(const box of boxes){
          if(x<box.x-32||x>box.x+box.w+32||y<box.y-32||y>box.y+box.h+32) continue;
          const [dist,nx,ny]=sd(box,x,y);
          const vn=Math.cos(a)*nx+Math.sin(a)*ny;

          if(dist<0){
            if(dist<-16 || vn<-.1) return null;
            const k=-dist-2+R()*R()*13;
            const lk=(.5+R()*R()*2.2)*(.7+noise(x*.05+20,y*.05)*.9);
            return [
              x+nx*k,
              y+ny*k,
              mix(a,Math.atan2(ny,nx),.12)+(R()-.5)*.45,
              len*lk,
              lm+2+(R()-.5)*6
            ];
          }

          if(dist<28){
            const ww=Math.pow(1-dist/28,1.5);
            if(vn<0){
              a=Math.atan2(
                Math.sin(a)-vn*ww*ny,
                Math.cos(a)-vn*ww*nx
              );
              len*=1-.2*ww;
            }
            lm-=11*ww;
          }
        }
        return [x,y,a,len,lm];
      }

      function fillBase(canvas,W,H,dpr,transparent=false){
        const c=canvas.getContext('2d');
        c.setTransform(dpr,0,0,dpr,0,0);
        c.clearRect(0,0,W,H);
        if(!transparent){
          c.fillStyle=`hsl(${T.h},${T.s}%,${L(9)}%)`;
          c.fillRect(0,0,W,H);
        }
      }

      // Deterministic world-coordinate root placement.
      // Neighboring tiles evaluate the same hairs inside the overlap, so no seam appears.
      function drawBackgroundTile(canvas,W,worldY,H,dpr){
        const c=canvas.getContext('2d');
        c.setTransform(dpr,0,0,dpr,0,0);
        c.lineCap='round';
        c.clearRect(0,0,W,H);
        c.fillStyle=`hsl(${T.h},${T.s}%,${L(9)}%)`;
        c.fillRect(0,0,W,H);

        const layers=[
          [12000,[.7,1.2],16,.85,14,.5],
          [11000,[.55,1],30,.8,15,.4],
          [8000,[.35,.7],55,.42,13,0]
        ];

        layers.forEach(([n,wid,l0,al,lb,blur],layerIndex)=>{
          const density=Math.max(.05,n*CFG.density);
          const spacing=Math.sqrt(100000/density);
          const ix0=Math.floor(-60/spacing)-1;
          const ix1=Math.ceil((W+60)/spacing)+1;
          const iy0=Math.floor((worldY-60)/spacing)-1;
          const iy1=Math.ceil((worldY+H+60)/spacing)+1;
          const batches={};

          for(let iy=iy0;iy<=iy1;iy++){
            for(let ix=ix0;ix<=ix1;ix++){
              let salt=0;
              const R=()=>hash01(ix,iy,layerIndex,++salt);
              let x=(ix+R())*spacing;
              let gy=(iy+R())*spacing;
              let a=flow(x,gy)+(R()-.5)*.2;
              let len=lb*(.8+R()*.9)*CFG.len;
              let lm=clump(x,gy);
              const af=a;
              const state=dent(x,gy,a,len,lm,R);
              if(!state) continue;
              [x,gy,a,len,lm]=state;

              const a2=af+bnd(x,gy)+(R()-.5)*.25;
              const x1=x+Math.cos(a)*len*.5;
              const gy1=gy+Math.sin(a)*len*.5;
              const li=Math.round((lm+R()*6-3)/3);
              const wi=Math.min(2,Math.max(0,(R()*3)|0));
              const hi=Math.min(2,Math.max(0,(R()*3)|0));
              const key=li+'_'+wi+'_'+hi;
              const obj=batches[key]||(batches[key]={p:new Path2D(),li,wi,hi});

              obj.p.moveTo(x,gy-worldY);
              obj.p.quadraticCurveTo(
                x1,gy1-worldY,
                x1+Math.cos(a2)*len*.5,
                gy1-worldY+Math.sin(a2)*len*.5
              );
            }
          }

          c.filter=blur?`blur(${blur}px)`:'none';
          for(const key in batches){
            const o=batches[key];
            c.strokeStyle=`hsla(${T.h+(o.hi-1)*4},${T.s+4}%,${L(l0+o.li*3)}%,${al})`;
            c.lineWidth=wid[0]+(wid[1]-wid[0])*o.wi/2;
            c.stroke(o.p);
          }
          c.filter='none';
        });
      }

      function boundaryPoint(box,p){
        const r=box.r;
        const sw=Math.max(0,box.w-2*r);
        const sh=Math.max(0,box.h-2*r);
        const arc=Math.PI*r/2;
        const per=2*sw+2*sh+4*arc;
        p=((p%per)+per)%per;

        const cor=(cx,cy,t)=>[
          cx+Math.cos(t)*r,
          cy+Math.sin(t)*r,
          Math.cos(t),
          Math.sin(t)
        ];

        if(p<sw) return [box.x+r+p,box.y,0,-1,per];
        p-=sw;
        if(p<arc){const q=cor(box.x+box.w-r,box.y+r,-Math.PI/2+p/r);return [...q,per]}
        p-=arc;
        if(p<sh) return [box.x+box.w,box.y+r+p,1,0,per];
        p-=sh;
        if(p<arc){const q=cor(box.x+box.w-r,box.y+box.h-r,p/r);return [...q,per]}
        p-=arc;
        if(p<sw) return [box.x+box.w-r-p,box.y+box.h,0,1,per];
        p-=sw;
        if(p<arc){const q=cor(box.x+r,box.y+box.h-r,Math.PI/2+p/r);return [...q,per]}
        p-=arc;
        if(p<sh) return [box.x,box.y+box.h-r-p,-1,0,per];
        p-=sh;
        const q=cor(box.x+r,box.y+r,Math.PI+p/r);
        return [...q,per];
      }

      function clipEdgeHair(sx,sy,a,len,ownId){
        // Don't even start a tuft inside/against a neighboring message.
        for(const other of boxes){
          if(other.id===ownId) continue;
          if(sd(other,sx,sy,3)[0] < 0) return 0;
        }

        const step=3;
        for(let t=step;t<=len;t+=step){
          const px=sx+Math.cos(a)*t;
          const py=sy+Math.sin(a)*t;
          for(const other of boxes){
            if(other.id===ownId) continue;
            if(sd(other,px,py,3)[0] < 0){
              return Math.max(0,t-step-1);
            }
          }
        }
        return len;
      }

      // Edge tufts live in a dedicated overlay stack instead of inside bubbles.
      // This prevents transcript disclosure from creating black canvas rectangles.
      function drawEdgeTile(canvas,W,worldY,H,dpr){
        const c=canvas.getContext('2d');
        c.setTransform(dpr,0,0,dpr,0,0);
        c.clearRect(0,0,W,H);
        c.lineCap='round';

        for(const box of boxes){
          if(box.y+box.h+CFG.edgeMax < worldY || box.y-CFG.edgeMax > worldY+H) continue;

          const r=box.r;
          const sw=Math.max(0,box.w-2*r);
          const sh=Math.max(0,box.h-2*r);
          const per=2*sw+2*sh+4*(Math.PI*r/2);
          const N=Math.max(10,Math.round(per*.78));

          for(let i=0;i<N;i++){
            const p=(i+hash01(box.id,i,31))*per/N;
            let [x,y,nx,ny]=boundaryPoint(box,p);

            // Bottom edge is deliberately calmer.
            if(ny>.3 && hash01(box.id,i,32)<.45) continue;

            const dist=4+hash01(box.id,i,33)*11;
            let sx=x+nx*dist;
            let sy=y+ny*dist;
            const a0=flow(sx,sy)+(hash01(box.id,i,34)-.5)*.2;
            const vn=Math.cos(a0)*nx+Math.sin(a0)*ny;
            if(vn>-.25) continue;

            // Edge overflow is intentionally independent of background CFG.len.
            // The background can stay longer while bubble-edge hairs remain controlled.
            const ov=hash01(box.id,i,35)<.28
              ? -1-hash01(box.id,i,36)*4
              : hash01(box.id,i,37)*hash01(box.id,i,38)*9;
            let len=Math.max(4,Math.min(dist/-vn+ov,CFG.edgeMax));
            const a=mix(a0,Math.atan2(-ny,-nx),.2);

            len=clipEdgeHair(sx,sy,a,len,box.id);
            if(len<4) continue;

            const bend=bnd(sx,sy)*len*.38;
            const ex=sx+Math.cos(a)*len;
            const ey=sy+Math.sin(a)*len;
            const tip=hash01(box.id,i,39)<.4;
            const localSy=sy-worldY;
            const localEy=ey-worldY;

            if(Math.max(localSy,localEy)<-4 || Math.min(localSy,localEy)>H+4) continue;

            c.strokeStyle=`hsla(${T.h+hash01(box.id,i,40)*10-5},${T.s+hash01(box.id,i,41)*8}%,${L((tip?58:30)+clump(sx,sy)+hash01(box.id,i,42)*8)}%,${tip?.55:.85})`;
            c.lineWidth=tip?.45+hash01(box.id,i,43)*.28:.62+hash01(box.id,i,43)*.45;
            c.beginPath();
            c.moveTo(sx,localSy);
            c.quadraticCurveTo(
              (sx+ex)/2-Math.sin(a)*bend,
              (localSy+localEy)/2+Math.cos(a)*bend,
              ex,localEy
            );
            c.stroke();
          }
        }
      }

      function createTileCanvas(kind,index,W,contentH,dpr){
        const visualTop=Math.max(0,index*CFG.tileH-CFG.overlap);
        const visualBottom=Math.min(contentH,(index+1)*CFG.tileH+CFG.overlap);
        const H=Math.max(1,visualBottom-visualTop);
        const cv=d.createElement('canvas');
        cv.className=kind==='bg'?'cocker-fur-tile':'cocker-edge-tile';
        cv.dataset.tileIndex=String(index);
        cv.style.top=visualTop+'px';
        cv.style.width=W+'px';
        cv.style.height=H+'px';
        cv.width=Math.max(1,Math.round(W*dpr));
        cv.height=Math.max(1,Math.round(H*dpr));
        cv._cockerWorldY=visualTop;
        cv._cockerCssH=H;
        cv._cockerDpr=dpr;
        return cv;
      }

      function resizeTileCanvas(cv,index,W,contentH,dpr,transparent){
        const visualTop=Math.max(0,index*CFG.tileH-CFG.overlap);
        const visualBottom=Math.min(contentH,(index+1)*CFG.tileH+CFG.overlap);
        const H=Math.max(1,visualBottom-visualTop);
        const needSize =
          cv.width!==Math.max(1,Math.round(W*dpr)) ||
          cv.height!==Math.max(1,Math.round(H*dpr)) ||
          cv._cockerWorldY!==visualTop;

        cv.style.top=visualTop+'px';
        cv.style.width=W+'px';
        cv.style.height=H+'px';
        cv._cockerWorldY=visualTop;
        cv._cockerCssH=H;
        cv._cockerDpr=dpr;

        if(needSize){
          cv.width=Math.max(1,Math.round(W*dpr));
          cv.height=Math.max(1,Math.round(H*dpr));
          fillBase(cv,W,H,dpr,transparent);
        }
        return needSize;
      }

      function syncTiles(W,H,dpr){
        const count=Math.max(1,Math.ceil(H/CFG.tileH));
        bgStack.style.height=H+'px';
        edgeStack.style.height=H+'px';

        for(const [idx,cv] of [...bgTiles]){
          if(idx>=count){
            cv.remove(); bgTiles.delete(idx);
          }
        }
        for(const [idx,cv] of [...edgeTiles]){
          if(idx>=count){
            cv.remove(); edgeTiles.delete(idx);
          }
        }

        const newlyCreated=new Set();
        for(let idx=0;idx<count;idx++){
          let bg=bgTiles.get(idx);
          if(!bg){
            bg=createTileCanvas('bg',idx,W,H,dpr);
            bgStack.appendChild(bg);
            bgTiles.set(idx,bg);
            fillBase(bg,W,bg._cockerCssH,dpr,false);
            newlyCreated.add(idx);
          }else if(resizeTileCanvas(bg,idx,W,H,dpr,false)){
            newlyCreated.add(idx);
          }

          let edge=edgeTiles.get(idx);
          if(!edge){
            edge=createTileCanvas('edge',idx,W,H,dpr);
            edgeStack.appendChild(edge);
            edgeTiles.set(idx,edge);
            fillBase(edge,W,edge._cockerCssH,dpr,true);
            newlyCreated.add(idx);
          }else if(resizeTileCanvas(edge,idx,W,H,dpr,true)){
            newlyCreated.add(idx);
          }
        }
        return newlyCreated;
      }

      function rectChanged(a,b){
        if(!a||!b) return true;
        return Math.abs(a.x-b.x)>.75 ||
               Math.abs(a.y-b.y)>.75 ||
               Math.abs(a.w-b.w)>.75 ||
               Math.abs(a.h-b.h)>.75;
      }

      function dirtyStartY(oldBoxes,newBoxes,oldH,newH,forceAll){
        if(forceAll || !oldBoxes.length) return 0;

        const oldMap=new Map(oldBoxes.map(b=>[b.id,b]));
        const newMap=new Map(newBoxes.map(b=>[b.id,b]));
        let min=Infinity;

        for(const [id,oldBox] of oldMap){
          const next=newMap.get(id);
          if(!next || rectChanged(oldBox,next)){
            min=Math.min(min,oldBox.y-CFG.edgeMax-CFG.overlap);
            if(next) min=Math.min(min,next.y-CFG.edgeMax-CFG.overlap);
          }
        }
        for(const [id,next] of newMap){
          if(!oldMap.has(id)){
            min=Math.min(min,next.y-CFG.edgeMax-CFG.overlap);
          }
        }

        if(newH!==oldH){
          min=Math.min(min,Math.max(0,Math.min(oldH,newH)-CFG.overlap*2));
        }
        return Number.isFinite(min)?Math.max(0,min):Infinity;
      }

      function paintTile(index){
        const bg=bgTiles.get(index), edge=edgeTiles.get(index);
        if(!bg||!edge) return;
        drawBackgroundTile(bg,previousWidth,bg._cockerWorldY,bg._cockerCssH,bg._cockerDpr);
        drawEdgeTile(edge,previousWidth,edge._cockerWorldY,edge._cockerCssH,edge._cockerDpr);
      }

      function requestUpdate(forceAll=false){
        cancelAnimationFrame(raf);
        raf=w.requestAnimationFrame(()=>updateNow(forceAll));
      }

      function updateNow(forceAll=false){
        if(!active()) return;
        if(!ensure()) return;

        const newBoxes=collectBoxes();
        const W=Math.max(1,area.clientWidth);
        const H=Math.max(area.clientHeight,measureContentHeight());

        const totalPixelBudget=26000000;
        const dpr=Math.max(
          .75,
          Math.min(w.devicePixelRatio||1,1.42,Math.sqrt(totalPixelBudget/(W*Math.max(H,1))))
        );

        const widthChanged=Math.abs(W-previousWidth)>.5;
        const newTiles=syncTiles(W,H,dpr);
        const startY=dirtyStartY(boxes,newBoxes,previousHeight,H,forceAll||widthChanged);
        boxes=newBoxes;
        previousHeight=H;
        previousWidth=W;

        const dirty=new Set(newTiles);
        if(Number.isFinite(startY)){
          const first=Math.max(0,Math.floor(startY/CFG.tileH));
          const last=Math.max(0,Math.ceil(H/CFG.tileH)-1);
          for(let i=first;i<=last;i++) dirty.add(i);
        }
        if(!dirty.size) return;

        // Every dirty tile is painted with the final algorithm immediately if visible.
        // Remaining dirty tiles are eagerly completed in idle time; scroll itself never paints.
        idleToken++;
        const token=idleToken;
        const viewTop=area.scrollTop-CFG.overlap;
        const viewBottom=area.scrollTop+area.clientHeight+CFG.overlap;
        const ordered=[...dirty].sort((a,b)=>{
          const ay=a*CFG.tileH, by=b*CFG.tileH;
          const av=ay<viewBottom && ay+CFG.tileH>viewTop ? 0 : 1;
          const bv=by<viewBottom && by+CFG.tileH>viewTop ? 0 : 1;
          return av-bv || Math.abs(ay-area.scrollTop)-Math.abs(by-area.scrollTop);
        });

        let cursor=0;
        while(cursor<ordered.length){
          const idx=ordered[cursor];
          const y=idx*CFG.tileH;
          const visible=y<viewBottom && y+CFG.tileH>viewTop;
          if(!visible) break;
          paintTile(idx);
          cursor++;
        }

        const idleStep=()=>{
          if(token!==idleToken || !active()) return;
          const stop=Math.min(ordered.length,cursor+1);
          for(;cursor<stop;cursor++) paintTile(ordered[cursor]);
          if(cursor<ordered.length){
            (w.requestIdleCallback||((fn)=>w.setTimeout(fn,0)))(idleStep,{timeout:80});
          }
        };
        if(cursor<ordered.length){
          (w.requestIdleCallback||((fn)=>w.setTimeout(fn,0)))(idleStep,{timeout:80});
        }
      }

      function isRendererNode(node){
        if(!node || node.nodeType!==1) return false;
        return node.matches?.(
          '.cocker-fur-stack,.cocker-edge-stack,.cocker-fur-tile,.cocker-edge-tile'
        ) || !!node.closest?.('.cocker-fur-stack,.cocker-edge-stack');
      }

      function start(){
        if(!ensure()) return;

        chatObserver?.disconnect();
        bodyObserver?.disconnect();

        chatObserver=new w.MutationObserver(mutations=>{
          if(!active()) return;
          let relevant=false;

          for(const m of mutations){
            if(m.target?.closest?.('.cocker-fur-stack,.cocker-edge-stack')) continue;

            if(m.type==='childList'){
              const changed=[...m.addedNodes,...m.removedNodes];
              if(changed.length && changed.every(isRendererNode)) continue;
              relevant=true;
              break;
            }

            if(m.type==='attributes' && m.attributeName==='hidden'){
              relevant=true;
              break;
            }
          }

          if(relevant) requestUpdate(false);
        });

        chatObserver.observe(area,{
          subtree:true,
          childList:true,
          attributes:true,
          attributeFilter:['hidden']
        });

        bodyObserver=new w.MutationObserver(()=>{
          if(active()){
            requestUpdate(true);
          }else{
            idleToken++;
          }
        });
        bodyObserver.observe(d.body,{attributes:true,attributeFilter:['class']});

        w.addEventListener('resize',()=>{
          if(active()) requestUpdate(true);
        });

        requestUpdate(true);
      }

      return {start,requestUpdate,active};
    })();

    // ------------------------------------------------------------
    // 3. Skin-dark presentation-only transcript behavior.
    // No assistant-generation wrapper: the fur renderer now reacts only to DOM geometry.
    // ------------------------------------------------------------
    try{
      if(typeof w.revealTranscriptText === 'function' && !w.__cockerRevealPatched){
        w.__cockerRevealPatched=true;
        const originalReveal=w.revealTranscriptText;
        w.revealTranscriptText=function(element,text){
          if(d.body.classList.contains('skin-dark')){
            if(!element) return;
            element.dataset.revealToken='';
            element.textContent=String(text||'');
            Cocker.requestUpdate(false);
            return;
          }
          return originalReveal.apply(this,arguments);
        };
      }
    }catch(err){
      console.warn('[Cocker test] transcript presentation hook install failed',err);
    }

    Cocker.start();

    // Keep the visible second-skin title semantic in case settings is re-rendered.
    const titleObserver=new w.MutationObserver(()=>{
      const dot=d.querySelector('.skin-dot.dot-dark');
      if(dot && dot.title!=='可卡') dot.title='可卡';
    });
    titleObserver.observe(d.body,{subtree:true,childList:true});

    console.info('[Cocker test] loaded over v1.36; data/store/API logic untouched.');
  });
})();
</script>
